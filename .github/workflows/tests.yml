name: Tests
# Automatic checks for the money and location paths: checkout, GPS shown or hidden, the unlock being
# saved in the buyer's browser, Near me (closest 5) and no caves. Plain-language notes: tests/README.md.
# Runs on every pull request, after every merge to main, once a day, and by hand (Run workflow).
# Needs no keys or secrets. It never pays, never opens a real Stripe checkout and never writes to the database.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 13 * * *' # every day at 13:23 UTC (7:23 a.m. Central in winter, 8:23 in summer)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  code:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Checkout function (pretend Stripe and database)
        run: |
          deno test --allow-env tests/unit/checkout.test.ts 2>&1 | tee "$RUNNER_TEMP/deno.txt" || {
            grep -E 'FAILED|=> ' "$RUNNER_TEMP/deno.txt" | head -20 | sed 's/^/::error title=Checkout test::/'
            exit 1
          }
      - name: Google pages (pretend database)
        run: >-
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./tests/gh-reporter.mjs --test-reporter-destination=stdout "tests/unit/*.test.js"
      - name: Install the test browser
        working-directory: tests
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: The app in a real browser (this branch's files, live public data, nothing sent anywhere)
        working-directory: tests
        run: npx playwright test

  live:
    name: Live site checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wait for the live site to serve this version
        run: node tests/live/wait-for-deploy.js
      - name: Live data, checkout refusals and every page
        run: >-
          node --test --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=./tests/gh-reporter.mjs --test-reporter-destination=stdout "tests/live/*.test.js"
      - name: Install the test browser
        working-directory: tests
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: The live app in a real browser (nothing sent anywhere)
        working-directory: tests
        env:
          BASE_URL: https://localamerica.us
        run: npx playwright test

  alert:
    name: Tell the owner
    needs: [code, live]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = 'Live check failed';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const when = new Date().toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
            const text = `The automatic checks of localamerica.us failed (${when}).\n\nDetails: ${run}\n\nAsk Claude to look at it. Claude closes this once it's fixed.`;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: text });
            else await github.rest.issues.create({ ...context.repo, title, body: `${text}\n\n@Rockxj89` });
