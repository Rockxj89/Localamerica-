<style>
  :root {

        rgba(247,249,250,.20) 53.84%, rgba(247,249,250,.20) 61.53%,
        rgba(224,109,109,.55) 61.53%, rgba(224,109,109,.55) 69.23%,
        rgba(247,249,250,.20) 69.23%, rgba(247,249,250,.20) 76.92%,
        rgba(224,109,109,.55) 76.92%, rgba(224,109,109,.55) 84.61%,
        rgba(247,249,250,.20) 84.61%, rgba(247,249,250,.20) 92.30%,
        rgba(224,109,109,.55) 92.30%, rgba(224,109,109,.55) 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 70%, transparent 100%);
  }
  /* Bigger, easier-to-read text (matches the Glide guide) */
  .big-text .t-sm { font-size: 1.125rem; line-height: 1.75rem; }
  .big-text .t-xs { font-size: 1rem; line-height: 1.5rem; }
  :where(.big-text) .t-base { font-size: 1.125rem; line-height: 1.75rem; }
  .clamp3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ico { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .ico-md { width: 1.25rem; height: 1.25rem; }
  .ico-sm { width: 1rem; height: 1rem; }
  .ico-xs { width: .875rem; height: .875rem; }
  /* Round dark buttons in the full-screen photo viewer */
  .pvb { display: flex; width: 2.75rem; height: 2.75rem; align-items: center; justify-content: center; border-radius: 9999px; background: rgba(0,0,0,.6); color: #fff; }
  .pvb.hidden { display: none; }

  /* ---- Modern look: motion, depth, feedback ---- */
  .lift { transition: transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); }
  .img-zoom { transition: transform var(--dur-slow) var(--ease-out); }
  @media (hover: hover) {
    .lift:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
    .lift:hover .img-zoom { transform: scale(1.04); }
    .navlink:hover { background: rgb(27 35 30 / .06); }
  }
  .press { transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast), box-shadow var(--dur-base); }
  .press:active { transform: scale(.98); }
  a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid #15803D; outline-offset: 2px; }
  .navlink[aria-current="page"] { background: rgb(21 128 61 / .12); color: #166534; }
  /* Pages whose title would land on the flag start just below it */
  #view[data-page="list"], #view[data-page="p"], #view[data-page="safety"] { padding-top: calc(var(--flag-clear) - 1.5rem); }
  .view-enter { animation: view-in var(--dur-slow) var(--ease-out); }
  @keyframes view-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .skel { background: linear-gradient(90deg, rgb(27 35 30 / .06) 25%, rgb(27 35 30 / .11) 37%, rgb(27 35 30 / .06) 63%); background-size: 400% 100%; animation: shimmer 1.6s ease infinite; }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }
  @media (min-width: 768px) {

  const R = 40, r = R * 0.382;
  const star = (cx, cy) => {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? R : r, a = (-90 + i * 36) * Math.PI / 180;
      pts.push(`${(cx + rad * Math.cos(a)).toFixed(1)},${(cy + rad * Math.sin(a)).toFixed(1)}`);
    }
    return `<polygon points="${pts.join(' ')}"/>`;
  };
  let s = '';
  for (let row = 0; row < 9; row++) {
    const y = 70.2 * (row + 1), long = row % 2 === 0;
    for (let k = 0; k < (long ? 6 : 5); k++) s += star((long ? 81.9 : 163.8) + k * 163.8, y);
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 988 700"><g fill="#ffffff" fill-opacity="0.85">${s}</g></svg>`;
  document.getElementById('app').style.setProperty('--stars', `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
})();

let sb = null;
const sessionId = (() => {
  try {
    let s = sessionStorage.getItem('la_sid');
    if (!s) { s = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)); sessionStorage.setItem('la_sid', s); }
    return s;
  } catch (e) { return null; }
})();

// Private token that ties GPS purchases to this browser (only its hash is stored on the server)
const accessToken = (() => {
  try {
    let t = localStorage.getItem('la_access_token');
    if (!/^[a-f0-9]{64}$/.test(t || '')) {
      const b = new Uint8Array(32); crypto.getRandomValues(b);
      t = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
      localStorage.setItem('la_access_token', t);
    }
    return t;
  } catch (e) { return null; }
})();

// ================= TRAFFIC COUNTER (read on the private traffic.html page) =================
// Long-lived random id per phone, so the Traffic page can tell new from returning visitors.
const visitorId = (() => {
  try {
    let v = localStorage.getItem('la_vid');
    if (!/^[a-z0-9-]{16,40}$/.test(v || '')) { v = crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now(); localStorage.setItem('la_vid', v); }
    return v;
  } catch (e) { return null; }
})();

// Where this visit came from (Facebook, Instagram...), remembered for the whole visit.
const landingReferrer = (() => {
  try {
    const stored = sessionStorage.getItem('la_ref');
    if (stored !== null) return stored || null;
    let host = '';
    try { host = document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) { host = ''; }
    if (host === location.hostname) host = '';
    // Facebook/Instagram's own in-app browser often hides the referrer; the user agent still tells us.
    if (!host && /FBAN|FBAV|FB_IAB|FBIOS|Messenger/i.test(navigator.userAgent)) host = 'facebook.com';
    if (!host && /Instagram/i.test(navigator.userAgent)) host = 'instagram.com';
    sessionStorage.setItem('la_ref', host);
    return host || null;
  } catch (e) { return null; }
})();

const ua = navigator.userAgent || '';
const isBot = !!navigator.webdriver || /bot|crawl|spider|slurp|facebookexternalhit|facebot|preview|headless|lighthouse|vercel|pingdom|uptime|python-requests|curl|wget/i.test(ua);
const inAppBrowser = /FBAN|FBAV|FB_IAB|FBIOS|Instagram|Messenger|Line\//i.test(ua);
const isStandalone = (() => { try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } })();
const browserLabel = (() => {
  if (isBot) return 'Bot or automation';
  const os = /iPhone|iPad|iPod/i.test(ua) ? 'iPhone or iPad' : /Android/i.test(ua) ? 'Android' : /Windows/i.test(ua) ? 'Windows' : /Mac OS X|Macintosh/i.test(ua) ? 'Mac' : /Linux/i.test(ua) ? 'Linux' : 'other device';
  let b = 'Other browser';
  if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) b = 'Facebook app';
  else if (/Instagram/i.test(ua)) b = 'Instagram app';
  else if (/SamsungBrowser/i.test(ua)) b = 'Samsung Internet';
  else if (/Edg\//i.test(ua)) b = 'Edge';
  else if (/Firefox|FxiOS/i.test(ua)) b = 'Firefox';
  else if (/CriOS|Chrome\//i.test(ua)) b = 'Chrome';
  else if (/Safari/i.test(ua)) b = 'Safari';
  return `${b} on ${os}`;
})();

async function logEvent(type, locationId = null, meta = {}) {
  // Sales steps (unlock_gps_click, checkout_start, checkout_complete) also go to the Meta pixel
  try { if (window.laPixel && !isBot) window.laPixel.event(type, locationId); } catch (e) { /* never break the app */ }
  // The traffic table only stores a place id for these event types
  const dbLocation = ['place_view', 'open_in_maps', 'unlock_gps_click', 'checkout_start'].includes(type) ? locationId : null;
  if (dbLocation == null && locationId != null) meta = { ...meta, location_id: locationId };
  if (visitorId) meta = { ...meta, vid: visitorId };
  const row = {
    event_type: type, location_id: dbLocation, visitor_session_hash: sessionId,
    browser_type: browserLabel, referrer_host: landingReferrer,
    automation_signal: isBot, event_metadata: meta
  };
  // Anything that happens before the database connection is ready waits here and is sent right after
  if (!sb) { pendingEvents.push(row); return; }
  try { await sb.from('poi_traffic_events').insert(row); } catch (e) { /* analytics must never break the app */ }
}
const pendingEvents = [];
function flushPendingEvents() {
  if (!sb || !pendingEvents.length) return;
  const rows = pendingEvents.splice(0);
  sb.from('poi_traffic_events').insert(rows).then(() => {}, () => {});
}

// One "interaction" per visit after the first real touch, tap, key press or scroll.
// Bots almost never do this, so it's how the Traffic page tells people from bots.
(function watchForPerson() {
  try { if (sessionStorage.getItem('la_touched')) return; } catch (e) { return; }
  const names = ['pointerdown', 'touchstart', 'keydown', 'scroll', 'wheel'];
  const started = Date.now();
  function done(ev) {
    if (!ev.isTrusted || Date.now() - started < 300) return;
    names.forEach((n) => window.removeEventListener(n, done));
    try { sessionStorage.setItem('la_touched', '1'); } catch (e) { /* fine */ }
    logEvent('interaction');
  }
  names.forEach((n) => window.addEventListener(n, done, { passive: true }));
})();

// ================= CHECKOUT (Stripe via Supabase function) =================
async function checkoutApi(action, extra = {}) {
  if (!accessToken) return { ok: false, error: 'This browser cannot save purchases. Turn on site storage and try again.' };
  try {
    const res = await fetch(CFG.CHECKOUT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY },
      body: JSON.stringify({ action, token: accessToken, ...extra })
    });
    return await res.json();
  } catch (e) {
    return { ok: false, error: 'No connection. Check your signal and try again.' };
  }
}

// Fill in GPS for every place this browser has paid for
async function loadUnlocked() {
  const r = await checkoutApi('unlocked');
  if (!r || !r.ok) return;
  (r.places || []).forEach((p) => {
    const l = state.locs.find((x) => String(x.id) === String(p.id));
    if (l) { l.latitude = p.latitude; l.longitude = p.longitude; l.unlocked = true; }
  });
}

// Runs when Stripe sends the buyer back to the app
async function handleCheckoutReturn() {
  const q = new URLSearchParams(location.search);
  const status = q.get('checkout');
  if (!status) return;
  const sid = q.get('session_id');
  history.replaceState(null, '', location.pathname + location.hash);
  if (status === 'cancelled') { logEvent('checkout_cancelled'); toast('Checkout cancelled. You were not charged.'); return; }
  if (status === 'success' && sid) {
    const r = await checkoutApi('complete', { sessionId: sid });
    if (r.ok) {
      logEvent('checkout_complete', r.locationId); toast('Payment received. GPS unlocked!');
      if (r.locationId != null) { state.confirmed = r.locationId; location.hash = '#/p/' + r.locationId; }
    }
    else toast(r.error || 'Could not confirm payment yet. Reopen the app in a minute.');
  }
}

async function startUnlock(id) {
  if (state.busy) return;
  state.busy = id; render();
  logEvent('unlock_gps_click', id);
  const r = await checkoutApi('start', { locationId: id, returnUrl: location.origin + location.pathname });
  if (r.ok && r.url) {
    logEvent('checkout_start', id);
    setTimeout(() => { location.href = r.url; }, 400); // give the pixel a moment to send
    return;
  }
  state.busy = null;
  if (r.ok && r.alreadyActive) { await loadUnlocked(); render(); toast('Already unlocked on this phone'); return; }
  render(); toast(r.error || 'Checkout had a problem. Please try again.');
}

// ================= DATA =================
async function loadData() {
  sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY);
  flushPendingEvents();
  const [l, p] = await Promise.all([
    sb.from('poi_public_locations').select('*').order('name').range(0, 999),
    sb.from('poi_public_photos').select('*').order('id').range(0, 4999)
  ]);
  if (l.error) throw new Error('Could not load places: ' + l.error.message);
  if (p.error) throw new Error('Could not load photos: ' + p.error.message);
  state.locs = l.data || [];
  state.photos = {};
  (p.data || []).forEach((ph) => { (state.photos[ph.location_id] ||= []).push(ph); });

  const map = {};
  state.locs.forEach((loc) => {
    const c = map[loc.category] ||= { name: loc.category, count: 0, photo: null, photoOf: '' };
    c.count++;
    if (!c.photo && state.photos[loc.id]?.length) { c.photo = state.photos[loc.id][0].object_key; c.photoOf = loc.name; }
  });
  state.cats = Object.values(map).sort((a, b) => a.name.localeCompare(b.name));
  state.ready = true;
}

function getPos(high = true) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject({ code: 0 });
    navigator.geolocation.getCurrentPosition((p) => resolve(p.coords), reject,
      { enableHighAccuracy: high, timeout: high ? 15000 : 20000, maximumAge: high ? 60000 : 300000 });
  });
}

// Driving miles from the server. The server looks up coordinates itself, so GPS never reaches the browser.
async function roadMilesFor(ids) {
  if (!state.userPos || !ids.length) return;
  try {
    const res = await fetch(CFG.ROAD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY },
      body: JSON.stringify({ origin: state.userPos, ids })
    });
    const r = await res.json();
    if (r && r.ok) Object.assign(state.road, r.miles || {});
  } catch (e) { /* straight-line miles still show */ }
}

async function findMe() {
  state.locStatus = 'loading'; render();
  const where = location.hash.startsWith('#/c/') ? 'category' : 'other_page';
  const category = where === 'category' ? (catBySlug(decodeURIComponent(location.hash.split('/')[2] || '')) || {}).name : null;
  logEvent('near_me_click', null, { from: where, ...(category ? { category } : {}) });
  let c;
  try {
    // If precise GPS is slow or unavailable, try once more with the phone's quicker, rougher fix
    c = await getPos().catch((e) => { if (e && e.code === 1) throw e; return getPos(false); });
  } catch (e) {
    const code = e && e.code;
    if (code === 1) logEvent('near_me_permission_denied', null, { inAppBrowser });
    else logEvent('near_me_location_unavailable', null, { reason: code === 3 ? 'timeout' : code === 2 ? 'position_unavailable' : 'unsupported', inAppBrowser });
    state.locStatus = code === 1 ? 'denied' : 'error';
    state.locReason = code === 3 ? 'timeout' : code === 2 ? 'position_unavailable' : null;
    return render();
  }
  logEvent('near_me_location_ready');
  try {
    state.userPos = { lat: c.latitude, lng: c.longitude };
    const { data, error } = await sb.rpc('poi_distances', { user_lat: c.latitude, user_lng: c.longitude });
    if (error) throw error;
    state.distances = {};
    (data || []).forEach((r) => { state.distances[r.id] = r.miles; });
    state.locStatus = 'ready';
    // Driving miles for the nearest 10 in the current place type (Glide's rule), fetched after the straight-line list shows
    state.road = {};
    const nearest = state.locs
      .filter((l) => (!category || l.category === category) && state.distances[l.id] != null)
      .sort((a, b) => state.distances[a.id] - state.distances[b.id])
      .slice(0, CFG.ROAD_NEAREST)
      .map((l) => l.id);
    roadMilesFor(nearest).then(() => render());
    // How many places this person actually sees nearby (0 = they wanted something we don't have close by)
    const pool = state.locs.filter((l) => (!category || l.category === category) && state.distances[l.id] != null &&
      (where === 'category' ? state.distances[l.id] <= CFG.NEAR_MILES : true));
    logEvent('near_me_results', null, { resultCount: pool.length, ...(category ? { category } : {}) });
  } catch (e) {
    state.locStatus = 'error';
  }
  render();
}

// The Distance button on every card: straight-line miles first, one more tap for road miles
function distanceUi(l) {
  const id = l.id, asked = String(state.cardAsk) === String(id);
  const d = state.distances ? state.distances[id] : null;
  const road = state.road[id];
  if (!state.distances) {
    if (state.locStatus === 'loading') return { label: asked ? 'Finding location…' : 'Distance', hint: '', busy: asked };
    if (asked && state.locStatus === 'denied') return { label: 'Distance', hint: 'Allow location in your browser, then tap Distance again.' };
    if (asked && state.locStatus === 'error') return { label: 'Distance', hint: 'We couldn’t get your location. Tap Distance to try again.' };
    return { label: 'Distance', hint: '' };
  }
  if (typeof road === 'number') return { label: `${fmtMi(road)} by road`, hint: '' };
  if (state.roadBusy[id]) return { label: 'Calculating…', hint: '', busy: true };
  if (d == null) return { label: 'Unavailable', hint: '' };
  if (road === null) return { label: 'No road route', hint: `No road route found. Straight line: ${fmtMi(d)}.` };
  return { label: `≈ ${fmtMi(d)}`, hint: state.roadFail[id] ? 'Couldn’t get road miles. Tap to retry.' : 'Straight line. Tap for road miles.' };
}

// One place type (cat given) or every place (cat = null)
function viewList(cat) {
  const label = cat ? catLabel(cat.name) : '';
  let items = cat ? state.locs.filter((l) => l.category === cat.name) : state.locs.slice();
  const nearOn = !!cat && state.catNear;
  const ready = state.locStatus === 'ready' && !!state.distances;
  if (nearOn && ready) {
    // Near me inside a place type: only the closest 5 within the radius, no "show more"
    items = items.filter((l) => (state.distances[l.id] ?? Infinity) <= CFG.NEAR_MILES)
                 .sort((a, b) => state.distances[a.id] - state.distances[b.id])
                 .slice(0, CFG.NEAR_PAGE_SIZE);
  }
  const shown = items.slice(0, state.shown);
  const scope = [nearOn ? `Within ${CFG.NEAR_MILES}-mile radius` : '', label].filter(Boolean).join(' · ');
  const nearMsg = ready
    ? (nearOn ? `Showing the closest ${CFG.NEAR_PAGE_SIZE} ${label.toLowerCase()} within a ${CFG.NEAR_MILES}-mile straight-line radius. Local America doesn’t store your location.`
              : `Show the closest ${CFG.NEAR_PAGE_SIZE} ${label.toLowerCase()} to you. Local America doesn’t store your location.`)
    : locMessage(`Show the closest ${CFG.NEAR_PAGE_SIZE} ${label.toLowerCase()} to you. Local America doesn’t store your location.`);
  const loading = state.locStatus === 'loading';

  let body;
  if (nearOn && !ready) {
    body = `
    <div class="space-y-2 text-center">
      <p class="t-sm text-infoink">${esc(locMessage('Finding your location…'))}</p>
      ${loading ? '' : inAppTip()}
      ${loading ? '' : `<button type="button" data-act="cat-near-on" class="${btnSecondary} mt-3">Try again</button>`}
    </div>`;
  } else if (items.length) {
    body = cardGrid(shown) + (nearOn ? '' : showMore(items.length, shown.length));
  } else {
    body = `
    <div class="py-10 text-center">
      <p class="t-base font-semibold text-primary">${cat ? 'No places match those filters.' : 'No places are available yet.'}</p>
      <p class="mt-2 t-sm text-secondary">${cat ? 'Try a broader search or view every field record.' : 'The guide has no field records to show.'}</p>
      ${cat ? `<a href="#/places" class="mt-4 inline-flex t-sm font-medium text-okink underline">Browse all places</a>` : ''}
    </div>`;
  }

  return `
  <div class="space-y-8">
    <header class="flex flex-col gap-5 md:flex-row md:items-end md:justify-between">
      <div class="min-w-0 flex-1">
        ${eyebrow('Local America')}
        <h1 class="font-display text-[length:var(--fs-h1)] font-semibold leading-[1.1] tracking-[-0.02em] text-primary">${esc(scope || 'Choose your next starting point.')}</h1>
        ${scope ? '' : `<p class="mt-3 max-w-2xl t-sm text-secondary">Use this base camp to browse places by name, type, or field note.</p>`}
      </div>
    </header>

    ${cat ? `
    <section class="flex flex-col gap-4 rounded-card bg-white p-5 shadow-card sm:flex-row sm:items-center sm:justify-between" aria-label="${esc(label)} distance filter">
      <div class="min-w-0">
        <h2 class="t-base font-semibold text-primary">Near me</h2>
        <p class="mt-1 t-sm text-secondary" aria-live="polite">${esc(nearMsg)}</p>
        ${ready ? '' : inAppTip('mt-2 t-sm text-secondary')}
      </div>
      <button type="button" data-act="${nearOn ? 'cat-near-off' : 'cat-near-on'}" class="${nearOn ? btnSecondary : btnPrimary}" ${loading ? 'disabled' : ''}>${icon('pin', 'ico-sm')}${nearOn ? `Show all ${esc(label)}` : 'Near me'}</button>

    ${body}

}

  const view = $('#view');
  if (state.error) {
    view.innerHTML = `<div class="text-center"><p class="t-sm text-errink">We couldn’t load the field records.</p><button type="button" data-act="reload" class="mt-3 t-sm font-medium text-errink underline">Try again</button></div>`;
    return;
  }
  if (!state.ready) {
    const pg = (location.hash.slice(1) || '/').split('/')[1];
    view.dataset.page = (pg === 'c' || pg === 'places') ? 'list' : (pg || 'home');
    view.innerHTML = `
    <div class="space-y-6" aria-busy="true">
      <p class="sr-only" role="status">Loading field records…</p>
      <div class="skel mx-auto h-24 w-2/3 rounded-2xl"></div>
      <div class="grid grid-cols-2 gap-3">
        <div class="skel col-span-2 aspect-[16/10] rounded-tile"></div>
        ${'<div class="skel aspect-[4/5] rounded-tile"></div>'.repeat(4)}
      </div>
    </div>`;
    return;
  }

  const [, a, b] = (location.hash.slice(1) || '/').split('/');
  const key = `${a || ''}/${b || ''}`;
  const wasCatNear = state.catNear;
  // The old Near Me page is gone; anyone with it saved or bookmarked lands on the home page
  if (a === 'near') { location.hash = '#/'; return; }
  if (key !== lastRouteKey) { state.shown = CFG.PAGE_SIZE; state.cardAsk = null; state.catNear = false; }

  let html;
  if (a === 'c' && b) {
    const cat = catBySlug(decodeURIComponent(b));
    if (!cat) { location.hash = '#/'; return; }
    html = viewList(cat);
  }
  else if (a === 'places') html = viewList(null);
  else if (a === 'p' && b) html = viewPlace(b);
  else if (a === 'about') html = viewAbout();
  else if (a === 'safety') html = viewSafety();
  else html = viewHome();
  view.dataset.page = (a === 'c' || a === 'places') ? 'list' : (a || 'home');
  view.innerHTML = html;

  // Active tab = soft green pill (no tab is lit on place and place-type pages)
  const active = !a ? 'home' : (a === 'about' || a === 'safety') ? 'about' : '';
  document.querySelectorAll('[data-nav]').forEach((el) => {
    if (el.dataset.nav === active) el.setAttribute('aria-current', 'page');
    else el.removeAttribute('aria-current');
  });

  if (key !== lastRouteKey) {
    const cameFrom = lastRouteKey;
    lastRouteKey = key; window.scrollTo(0, 0);
    view.classList.remove('view-enter'); void view.offsetWidth; view.classList.add('view-enter');
    if (a === 'about' && b === 'contact') { const c = document.getElementById('contact'); if (c) c.scrollIntoView(); }
    if (a === 'p' && b) {
      // Note when the place was opened from a Near me list, so the Traffic page can see if Near me leads anywhere
      const meta = cameFrom.startsWith('c/') && wasCatNear ? { source: 'near_me_category' } : {};
      logEvent('place_view', Number(b), meta);
    } else if (a === 'c' && b) {
      const cat = catBySlug(decodeURIComponent(b));
      logEvent('category_view', null, cat ? { category: cat.name } : {});
    }
  }
}

// ================= PHOTO VIEWER (pinch, scroll or double-tap to zoom; drag to look around) =================
const pv = { photos: [], i: 0, alt: '', scale: 1, x: 0, y: 0, pts: new Map(),
  g: { startDist: 1, startScale: 1, downX: 0, downY: 0, panX: 0, panY: 0, moved: false, lastTap: 0 } };

function pvSet(scale, x, y) {
  const img = $('#pvImg'), stage = $('#pvStage');
  const s = Math.min(5, Math.max(1, scale));
  if (s === 1) { x = 0; y = 0; }
  else {
    const lx = Math.max(0, (img.offsetWidth * s - stage.clientWidth) / 2);
    const ly = Math.max(0, (img.offsetHeight * s - stage.clientHeight) / 2);
    x = Math.min(lx, Math.max(-lx, x)); y = Math.min(ly, Math.max(-ly, y));
  }
  pv.scale = s; pv.x = x; pv.y = y;
  img.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  img.style.cursor = s > 1 ? 'grab' : 'zoom-in';
}
function pvShow() {
  const many = pv.photos.length > 1, img = $('#pvImg');
  img.src = pv.photos[pv.i]; img.alt = pv.alt;
  pv.pts.clear(); pvSet(1, 0, 0);
  $('#pvPrev').classList.toggle('hidden', !many);
  $('#pvNext').classList.toggle('hidden', !many);
  $('#pvCap').textContent = (many ? `${pv.i + 1} of ${pv.photos.length} · ` : '') + 'Pinch or scroll to zoom, drag to look around';
}
function pvOpen(photos, i, alt) {
  if (!photos.length) return;
  pv.photos = photos; pv.i = Math.min(Math.max(0, i || 0), photos.length - 1); pv.alt = alt;
  $('#pv').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  pvShow();
}
function pvClose() { $('#pv').classList.add('hidden'); document.body.style.overflow = ''; $('#pvImg').removeAttribute('src'); }
function pvGo(step) { pv.i = (pv.i + step + pv.photos.length) % pv.photos.length; pvShow(); }
const pvOpenNow = () => !$('#pv').classList.contains('hidden');

(function wirePhotoViewer() {
  const stage = $('#pvStage'), g = pv.g;
  const dist = () => { const [a, b] = Array.from(pv.pts.values()); return Math.hypot(a.x - b.x, a.y - b.y); };
  stage.addEventListener('pointerdown', (e) => {
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    pv.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pv.pts.size === 1) { g.moved = false; g.downX = e.clientX; g.downY = e.clientY; g.panX = pv.x; g.panY = pv.y; }
    else if (pv.pts.size === 2) { g.startDist = dist() || 1; g.startScale = pv.scale; g.moved = true; }
  });
  stage.addEventListener('pointermove', (e) => {
    if (!pv.pts.has(e.pointerId)) return;
    pv.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pv.pts.size === 2) pvSet((g.startScale * dist()) / g.startDist, pv.x, pv.y);
    else if (pv.pts.size === 1) {
      const dx = e.clientX - g.downX, dy = e.clientY - g.downY;
      if (Math.hypot(dx, dy) > 6) g.moved = true;
      if (pv.scale > 1) pvSet(pv.scale, g.panX + dx, g.panY + dy);
    }
  });
  const end = (e) => {
    if (!pv.pts.has(e.pointerId)) return;
    pv.pts.delete(e.pointerId);
    if (pv.pts.size === 1) {
      // One finger left after a pinch: keep panning from where it is now
      const [rest] = Array.from(pv.pts.values());
      g.downX = rest.x; g.downY = rest.y; g.panX = pv.x; g.panY = pv.y;
      return;
    }
    if (pv.pts.size > 0 || g.moved || e.type === 'pointercancel') return;
    // A plain tap: outside the photo closes, a double tap on the photo zooms
    const r = $('#pvImg').getBoundingClientRect();
    const onImage = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (!onImage) return pvClose();
    const now = Date.now();
    if (now - g.lastTap < 320) { g.lastTap = 0; pv.scale > 1 ? pvSet(1, 0, 0) : pvSet(2.5, 0, 0); }
    else g.lastTap = now;
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', (e) => { e.preventDefault(); pvSet(pv.scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15), pv.x, pv.y); }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (!pvOpenNow()) return;
    if (e.key === 'Escape') pvClose();
    else if (e.key === 'ArrowLeft' && pv.photos.length > 1) pvGo(-1);
    else if (e.key === 'ArrowRight' && pv.photos.length > 1) pvGo(1);
  });
})();

// ================= EVENTS =================
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'pv-close') return pvClose();
  if (act === 'pv-prev') return pvGo(-1);
  if (act === 'pv-next') return pvGo(1);
  if (act === 'pv-in') return pvSet(pv.scale * 1.5, pv.x, pv.y);
  if (act === 'pv-out') return pvSet(pv.scale / 1.5, pv.x, pv.y);
  if (act === 'pv-open') {
    const l = state.locs.find((x) => String(x.id) === String(el.dataset.id));
    if (!l) return;
    return pvOpen((state.photos[l.id] || []).map((p) => photoUrl(p.object_key)), Number(el.dataset.i), `${l.name} field photo`);
  }
  if (act === 'reload') return location.reload();
  if (act === 'unlock') return startUnlock(Number(el.dataset.id));
  if (act === 'cat-near-on') { state.catNear = true; state.shown = CFG.PAGE_SIZE; return state.distances ? render() : findMe(); }
  if (act === 'cat-near-off') { state.catNear = false; state.shown = CFG.PAGE_SIZE; return render(); }
  if (act === 'more') { state.shown += CFG.PAGE_SIZE; return render(); }
  if (act === 'dist') {
    const id = Number(el.dataset.id);
    // First tap: find the phone and show straight-line miles on every card
    if (!state.distances) { state.cardAsk = id; return findMe(); }
    // Next tap: ask for road miles for this one place
    if (typeof state.road[id] === 'number' || state.road[id] === null || state.distances[id] == null || state.roadBusy[id]) return;
    state.roadBusy[id] = true; delete state.roadFail[id]; render();
    await roadMilesFor([id]);
    delete state.roadBusy[id];
    if (state.road[id] === undefined) state.roadFail[id] = true;
    return render();
  }
  if (act === 'maps') { logEvent('open_in_maps', Number(el.dataset.id)); return; }
  if (act === 'open-browser') {
    // Asks Android to open this exact page in the phone's default browser.
    // Facebook's browser may ignore it, so the menu tip stays underneath.
    const { host, pathname, search, hash } = location;
    location.href = `intent://${host}${pathname}${search}${hash}#Intent;scheme=https;action=android.intent.action.VIEW;end`;
    return;
  }
  if (act === 'install') {
    if (state.installEvent) {
      try {
        state.installEvent.prompt();
        const choice = await state.installEvent.userChoice;
        if (choice && choice.outcome === 'accepted') state.installed = true;
      } catch (err) { state.steps = true; }
      state.installEvent = null;
    } else {
      state.steps = !state.steps;
    }
    return renderInstall();
  }
});

window.addEventListener('hashchange', render);

// If someone backs out of Stripe, don't leave the button stuck on "Opening…"
window.addEventListener('pageshow', (e) => { if (e.persisted && state.busy) { state.busy = null; render(); } });

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); state.installEvent = e; renderInstall();
  try { if (!sessionStorage.getItem('la_ip')) { sessionStorage.setItem('la_ip', '1'); logEvent('install_prompt_shown'); } } catch (err) { /* fine */ }
});
window.addEventListener('appinstalled', () => { state.installed = true; state.installEvent = null; renderInstall(); toast('App installed'); logEvent('app_installed'); });
renderInstall();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

// ================= START =================
render();
loadData()
  .then(async () => {
    render();
    logEvent('app_open', null, { standalone: isStandalone, inAppBrowser });
    await handleCheckoutReturn();
    await loadUnlocked();
    render();
  })
  .catch((err) => { state.error = err.message || String(err); render(); });
</script>
</body>
