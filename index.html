// 50 stars for the flag background (same layout as the Glide app)
(function drawStars() {
  const R = 40, r = R * 0.382;
  const star = (cx, cy) => {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? R : r, a = (-90 + i * 36) * Math.PI / 180;
      pts.push(`${(cx + rad * Math.cos(a)).toFixed(1)},${(cy + rad * Math.sin(a)).toFixed(1)}`);
    }
    return `<polygon points="${pts.join(' ')}"/>`;
  };
  let s = '';
  for (let row = 0; row < 9; row++) {
    const y = 70.2 * (row + 1), long = row % 2 === 0;
    for (let k = 0; k < (long ? 6 : 5); k++) s += star((long ? 81.9 : 163.8) + k * 163.8, y);
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 988 700"><g fill="#ffffff" fill-opacity="0.85">${s}</g></svg>`;
  document.getElementById('app').style.setProperty('--stars', `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
})();

// Facebook adds "?fbclid=..." to links it opens, and the place type short links (/camp and the others)
// carry that after the "#", which sent visitors to Home instead of the list. Anything after a "?" in the
// "#" part moves back into the normal query, so the right page opens and a link tag (?from=...) is still read.
(function moveQueryOutOfHash() {
  try {
    const h = location.hash, i = h.indexOf('?');
    if (i < 0) return;
    const q = new URLSearchParams(location.search);
    new URLSearchParams(h.slice(i + 1)).forEach((v, k) => { if (!q.has(k)) q.set(k, v); });
    const qs = q.toString();
    history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + h.slice(0, i));
  } catch (e) { /* never break the app */ }
})();

// Link tag: ?from=<name> at the end of a link made with the link maker on the Traffic page (not ?s=,
// which the place pages already use). Saved with every event of the visit, so the Traffic scoreboard can
// rank where visitors come from. Only lowercase letters, numbers and dashes are kept.
const linkTag = (() => {
  try {
    const stored = sessionStorage.getItem('la_src');
    if (stored !== null) return stored || null;
    let t = ''; try { t = new URLSearchParams(location.search).get('from') || ''; } catch (e) { t = ''; }
    t = t.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40).replace(/-+$/, '');
    sessionStorage.setItem('la_src', t);
    return t || null;
  } catch (e) { return null; }
})();

// Where this visit came from (Facebook, Instagram...), remembered for the whole visit.
const landingReferrer = (() => {
  try {
    const stored = sessionStorage.getItem('la_ref');
    if (stored !== null) return stored || null;
    let host = '';
    try { host = document.referrer ? new URL(document.referrer).hostname : ''; } catch (e) { host = ''; }
    if (host === location.hostname) host = '';
    // The short link localamerica.us/r forwards to /?s=r. It marks the visit as Reddit even when the Reddit app hides the referrer.
    let tag = ''; try { tag = new URLSearchParams(location.search).get('s') || ''; } catch (e) { tag = ''; }
    if (tag === 'r') host = 'reddit.com';
    if (/(^|\.)(reddit\.com|redd\.it)$/i.test(host)) host = 'reddit.com';
    // Facebook/Instagram's own in-app browser often hides the referrer; the user agent still tells us.
    if (!host && /FBAN|FBAV|FB_IAB|FBIOS|Messenger/i.test(navigator.userAgent)) host = 'facebook.com';
    if (!host && /Instagram/i.test(navigator.userAgent)) host = 'instagram.com';
    sessionStorage.setItem('la_ref', host);
    return host || null;
  } catch (e) { return null; }
})();

async function logEvent(type, locationId = null, meta = {}) {
  // Sales steps (unlock_gps_click, checkout_start, checkout_complete) also go to the Meta pixel
  try { if (window.laPixel && !isBot) window.laPixel.event(type, locationId); } catch (e) { /* never break the app */ }
  // The traffic table only stores a place id for these event types
  const dbLocation = ['place_view', 'open_in_maps', 'unlock_gps_click', 'checkout_start'].includes(type) ? locationId : null;
  if (dbLocation == null && locationId != null) meta = { ...meta, location_id: locationId };
  if (visitorId) meta = { ...meta, vid: visitorId };
  if (linkTag) meta = { ...meta, src: linkTag };
  const row = {
    event_type: type, location_id: dbLocation, visitor_session_hash: sessionId,
    browser_type: browserLabel, referrer_host: landingReferrer,
    automation_signal: isBot, event_metadata: meta
  };
  // Anything that happens before the database connection is ready waits here and is sent right after
  if (!sb) { pendingEvents.push(row); return; }
  try { await sb.from('poi_traffic_events').insert(row); } catch (e) { /* analytics must never break the app */ }
}
const pendingEvents = [];
function flushPendingEvents() {
  if (!sb || !pendingEvents.length) return;
  const rows = pendingEvents.splice(0);
  sb.from('poi_traffic_events').insert(rows).then(() => {}, () => {});
}

// One "interaction" per visit after the first real touch, tap, key press or scroll.
// Bots almost never do this, so it's how the Traffic page tells people from bots.
(function watchForPerson() {
  try { if (sessionStorage.getItem('la_touched')) return; } catch (e) { return; }
  const names = ['pointerdown', 'touchstart', 'keydown', 'scroll', 'wheel'];
  const started = Date.now();
  function done(ev) {
    if (!ev.isTrusted || Date.now() - started < 300) return;
    names.forEach((n) => window.removeEventListener(n, done));
    try { sessionStorage.setItem('la_touched', '1'); } catch (e) { /* fine */ }
    logEvent('interaction');
  }
  names.forEach((n) => window.addEventListener(n, done, { passive: true }));
})();

// ================= ERROR LOG (read on the private traffic.html page) =================
// JavaScript errors in the visitor's browser are saved as "js_error" events, so a broken page shows up
// on the Traffic page. Visitors see nothing. At most 10 per visit and each message only once.
// Anything after a "?" in a web address, and any number that could be a coordinate, is removed first.
// These events are never sent to the Meta pixel.
(function watchForErrors() {
  const seen = new Set();
  let sent = 0;
  const clean = (s, max) => String(s || '').replace(/\?[^\s'")]*/g, '').replace(/-?\d{1,3}\.\d{3,}/g, '#').replace(/\s+/g, ' ').trim().slice(0, max);
  function report(message, file, line) {
    try {
      const msg = clean(message, 200) || 'Unknown error';
      if (sent >= 10 || seen.has(msg)) return;
      seen.add(msg); sent++;
      const meta = { message: msg, page: clean(location.pathname + location.hash, 80) || '/' };
      if (file) meta.file = clean(String(file).split('/').pop(), 60);
      if (Number(line)) meta.line = Number(line);
      logEvent('js_error', null, meta);
    } catch (e) { /* error logging must never break the app */ }
  }
  window.addEventListener('error', (e) => { report(e.message, e.filename, e.lineno); });
  window.addEventListener('unhandledrejection', (e) => {
    const r = e.reason;
    report('Unhandled promise: ' + (r && r.message ? r.message : String(r)), null, null);
  });
})();

async function checkoutApi(action, extra = {}) {
  if (!accessToken) return { ok: false, error: 'This browser cannot save purchases. Turn on site storage and try again.' };
  try {
    const res = await fetch(CFG.CHECKOUT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: CFG.SUPABASE_KEY },
      body: JSON.stringify({ action, token: accessToken, ...extra })
    });
    return await res.json();
  } catch (e) {
    return { ok: false, error: 'No connection. Check your signal and try again.' };
  }
}

// Fill in GPS for every place this browser has paid for
async function loadUnlocked() {
  const r = await checkoutApi('unlocked');
  if (!r || !r.ok) return;
  (r.places || []).forEach((p) => {
    const l = state.locs.find((x) => String(x.id) === String(p.id));
    if (l) { l.latitude = p.latitude; l.longitude = p.longitude; l.unlocked = true; }
  });
}

// Runs when Stripe sends the buyer back to the app
async function handleCheckoutReturn() {
  const q = new URLSearchParams(location.search);
  const status = q.get('checkout');
  if (!status) return;
  const sid = q.get('session_id');
  history.replaceState(null, '', location.pathname + location.hash);
  if (status === 'cancelled') { logEvent('checkout_cancelled'); toast('Checkout cancelled. You were not charged.'); return; }
  if (status === 'success' && sid) {
    const r = await checkoutApi('complete', { sessionId: sid });
    if (r.ok) {
      logEvent('checkout_complete', r.locationId); toast('Payment received. GPS unlocked!');
      if (r.locationId != null) { state.confirmed = r.locationId; location.hash = '#/p/' + r.locationId; }
    }
    else toast(r.error || 'Could not confirm payment yet. Reopen the app in a minute.');
  }
}

async function startUnlock(id) {
  if (state.busy) return;
  state.busy = id; render();
  logEvent('unlock_gps_click', id);
  const r = await checkoutApi('start', { locationId: id, returnUrl: location.origin + location.pathname });
  if (r.ok && r.url) {
    logEvent('checkout_start', id);
    setTimeout(() => { location.href = r.url; }, 400); // give the pixel a moment to send
    return;
  }
  state.busy = null;
  if (r.ok && r.alreadyActive) { await loadUnlocked(); render(); toast('Already unlocked on this phone'); return; }
  render(); toast(r.error || 'Checkout had a problem. Please try again.');
}

    sb.from('poi_public_photos').select('*').order('id').range(0, 4999)
  ]);
  if (l.error) throw new Error('Could not load places: ' + l.error.message);
  if (p.error) throw new Error('Could not load photos: ' + p.error.message);
  // Grouped by place type, then number order inside each type (Camp #2 before Camp #10); places without a number go last, A to Z
  const placeNum = (n) => { const m = /(\d+)\s*$/.exec(n || ''); return m ? +m[1] : Infinity; };
  state.locs = (l.data || []).sort((a, b) => (a.category || '').localeCompare(b.category || '') || (placeNum(a.name) - placeNum(b.name)) || (a.name || '').localeCompare(b.name || ''));
  state.photos = {};
  (p.data || []).forEach((ph) => { (state.photos[ph.location_id] ||= []).push(ph); });

  const map = {};
  state.locs.forEach((loc) => {
    const c = map[loc.category] ||= { name: loc.category, count: 0, photo: null, photoOf: '' };
    c.count++;
    if (!c.photo && state.photos[loc.id]?.length) { c.photo = state.photos[loc.id][0].object_key; c.photoOf = loc.name; }
  });
  state.cats = Object.values(map).sort((a, b) => a.name.localeCompare(b.name));
  state.ready = true;
}

function getPos(high = true) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject({ code: 0 });
    navigator.geolocation.getCurrentPosition((p) => resolve(p.coords), reject,
      { enableHighAccuracy: high, timeout: high ? 15000 : 20000, maximumAge: high ? 60000 : 300000 });
  });
}

async function findMe() {
  state.locStatus = 'loading'; render();
  const where = location.hash.startsWith('#/c/') ? 'category' : 'other_page';
  const category = where === 'category' ? (catBySlug(decodeURIComponent(location.hash.split('/')[2] || '')) || {}).name : null;
  logEvent('near_me_click', null, { from: where, ...(category ? { category } : {}) });
  let c;
  try {
    // If precise GPS is slow or unavailable, try once more with the phone's quicker, rougher fix
    c = await getPos().catch((e) => { if (e && e.code === 1) throw e; return getPos(false); });
  } catch (e) {
    const code = e && e.code;
    if (code === 1) logEvent('near_me_permission_denied', null, { inAppBrowser });
    else logEvent('near_me_location_unavailable', null, { reason: code === 3 ? 'timeout' : code === 2 ? 'position_unavailable' : 'unsupported', inAppBrowser });
    state.locStatus = code === 1 ? 'denied' : 'error';
    state.locReason = code === 3 ? 'timeout' : code === 2 ? 'position_unavailable' : null;
    return render();
  }
  logEvent('near_me_location_ready');
  try {
    // Straight-line miles, worked out in our own database (no driving-miles lookup)
    const { data, error } = await sb.rpc('poi_distances', { user_lat: c.latitude, user_lng: c.longitude });
    if (error) throw error;
    state.distances = {};
    (data || []).forEach((r) => { state.distances[r.id] = r.miles; });
    state.locStatus = 'ready';
    // How many places this person actually sees nearby (0 = they wanted something we don't have close by)
    const pool = state.locs.filter((l) => (!category || l.category === category) && state.distances[l.id] != null &&
      (where === 'category' ? state.distances[l.id] <= CFG.NEAR_MILES : true));
    logEvent('near_me_results', null, { resultCount: pool.length, ...(category ? { category } : {}) });
  } catch (e) {
    state.locStatus = 'error';
  }
  render();
}

// ================= VIDEOS (TikTok videos from @local_america, stored in the public "tiktok-videos" bucket) =================
// The list lives in videos.json: [{ "file": "<filename in the bucket>", "place": <place id, optional> }, ...], newest first.
// A video with a "place" shows on that place's page, and its full-screen player gets a "Go to <place name>" button.
const VIDEO_BATCH = 6;
const VIDEO_BASE = 'https://ycdlxdijrlfsxvxksyrq.supabase.co/storage/v1/object/public/tiktok-videos/';
const vid = { list: null, place: {}, failed: false, shown: VIDEO_BATCH, loading: false };
const safeFile = (f) => typeof f === 'string' && /^[A-Za-z0-9_-]{5,80}\.mp4$/.test(f);
function loadVideos() {
  if (vid.list || vid.loading || vid.failed) return;
  vid.loading = true;
  fetch('videos.json', { cache: 'no-cache' })
    .then((r) => r.ok ? r.json() : Promise.reject(new Error('videos ' + r.status)))
    .then((d) => {
      const rows = (Array.isArray(d) ? d : []).filter((v) => v && safeFile(v.file));
      vid.list = rows.map((v) => v.file);
      vid.place = {};
      rows.forEach((v) => { if (Number.isInteger(v.place) && v.place > 0) vid.place[v.file] = v.place; });
    })
    .catch(() => { vid.failed = true; })
    .finally(() => { vid.loading = false; const pg = (location.hash.slice(1) || '/').split('/')[1]; if (pg === 'videos' || pg === 'p') render(); });
}
// The video that belongs to a place (first one in the list), or null
function placeVideo(id) {
  if (!vid.list) return null;
  return vid.list.find((f) => String(vid.place[f]) === String(id)) || null;
}
// Small tile: a still from the start of the video (the "#t=0.1" makes phones show that frame instead of black).
// Tapping it opens the full-screen player.
const videoCard = (file) => videoTile(file, 'aspect-[4/5]');
const videoTile = (file, shape, solo) => `
  <button type="button" data-act="vv-open" data-f="${file}"${solo ? ' data-solo="1"' : ''} aria-label="Play video" class="lift press relative block ${shape} w-full min-w-0 overflow-hidden rounded-tile bg-black shadow-card">
    <video class="pointer-events-none absolute inset-0 h-full w-full object-cover" src="${VIDEO_BASE}${file}#t=0.1" muted playsinline preload="metadata" tabindex="-1" aria-hidden="true"></video>
    <span class="absolute inset-0 flex items-center justify-center">
      <span class="flex h-14 w-14 items-center justify-center rounded-full text-white" style="background: rgba(0,0,0,.55);">
        <svg viewBox="0 0 24 24" class="h-7 w-7" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
      </span>
    </span>
  </button>`;
// Which video in the list is open, so a swipe (or the arrows on a computer) can move to the next or previous one.
// Two video players take turns, so on phones the next video can slide in while the old one slides away (TikTok style).
const vv = { i: -1, solo: false, sx: 0, sy: 0, t0: 0, dy: 0, track: false, drag: false, busy: false, timer: 0,
  cur: document.getElementById('vvVideo'), spare: document.getElementById('vvVideo2') };
const vvPlay = (v) => { const p = v.play(); if (p && p.catch) p.catch(() => {}); };
function vvStop(v) {
  try { v.pause(); } catch (err) { /* fine */ }
  v.removeAttribute('src'); v.load();
}
// The "Go to <place name>" button: points at the place of the video now showing
function vvPlaceLink(file) {
  const a = $('#vvPlace');
  const pid = !vv.solo && vid.place[file];
  const pl = pid ? state.locs.find((x) => String(x.id) === String(pid)) : null;
  a.classList.toggle('hidden', !pl);
  a.setAttribute('href', pl ? '#/p/' + pl.id : '#/');
  a.textContent = pl ? 'Go to ' + (pl.name || 'this place') : '';
}
function vvLoad(file) {
  vvPlaceLink(file);
  const v = vv.cur;
  try { v.pause(); } catch (err) { /* fine */ }
  v.src = VIDEO_BASE + file;
  vvPlay(v);
}
// Puts both players back to the starting position (current one showing, spare one hidden)
function vvReset() {
  clearTimeout(vv.timer); vv.busy = false; vv.track = false; vv.drag = false;
  [vv.cur, vv.spare].forEach((v) => { v.classList.remove('anim'); v.style.transform = ''; });
  vv.cur.style.visibility = ''; vv.spare.style.visibility = 'hidden';
}
// solo: opened from a place page, so just that one video (no next / previous)
function vvOpen(file, solo) {
  if (!safeFile(file)) return;
  vvReset(); vvStop(vv.spare);
  vv.solo = !!solo;
  vv.i = vid.list && !solo ? vid.list.indexOf(file) : -1;
  const many = vv.i >= 0 && vid.list.length > 1;
  $('#vvPrev').classList.toggle('hidden', !many);
  $('#vvNext').classList.toggle('hidden', !many);
  $('#vv').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  vvLoad(file);
}
const vvMany = () => vvOpenNow() && !!vid.list && vid.list.length > 1 && vv.i >= 0;
// Computers (arrows and arrow keys): switch straight to the next or previous video. Wraps around. No autoplay.
function vvGo(step) {
  if (!vvMany() || vv.busy) return;
  vv.i = (vv.i + step + vid.list.length) % vid.list.length;
  vvLoad(vid.list[vv.i]);
}
// Phones: step 1 = next (old video slides up and away), -1 = previous (old video slides down)
function vvSlide(step) {
  if (!vvMany() || vv.busy) return vvSnapBack();
  vv.busy = true;
  vv.i = (vv.i + step + vid.list.length) % vid.list.length;
  const out = vv.cur, inc = vv.spare, h = window.innerHeight;
  try { out.pause(); } catch (err) { /* fine */ }
  inc.classList.remove('anim');
  inc.style.transform = `translateY(${step > 0 ? h : -h}px)`;
  inc.style.visibility = '';
  inc.src = VIDEO_BASE + vid.list[vv.i];
  vvPlaceLink(vid.list[vv.i]);
  vvPlay(inc);
  void inc.offsetWidth;
  out.classList.add('anim'); inc.classList.add('anim');
  out.style.transform = `translateY(${step > 0 ? -h : h}px)`;
  inc.style.transform = 'translateY(0)';
  vv.timer = setTimeout(() => {
    vvStop(out);
    vv.cur = inc; vv.spare = out;
    vvReset();
  }, 320);
}
// Not swiped far enough: the video slides back into place
function vvSnapBack() {
  const v = vv.cur;
  v.classList.add('anim'); v.style.transform = 'translateY(0)';
  setTimeout(() => { if (!vv.drag) v.classList.remove('anim'); }, 320);
}
function vvClose() {
  vvReset();
  vvStop(vv.cur); vvStop(vv.spare);
  vv.i = -1;
  $('#vvPlace').classList.add('hidden');
  $('#vv').classList.add('hidden'); document.body.style.overflow = '';
}
const vvOpenNow = () => !$('#vv').classList.contains('hidden');
window.addEventListener('keydown', (e) => {
  if (!vvOpenNow()) return;
  if (e.key === 'Escape') vvClose();
  else if (e.key === 'ArrowLeft') { e.preventDefault(); vvGo(-1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); vvGo(1); }
});
window.addEventListener('hashchange', () => { if (vvOpenNow()) vvClose(); });
// Tapping the dark area around the video closes it
document.getElementById('vv').addEventListener('click', (e) => { if (e.target.id === 'vv') vvClose(); });
// Phones: swipe up = next video, swipe down = previous. The video follows your finger.
// Left/right swipes do nothing. Swipes that start on the play bar at the bottom of the video are ignored.
(function wireVideoSwipe() {
  const box = document.getElementById('vv');
  box.addEventListener('touchstart', (e) => {
    vv.track = false; vv.drag = false;
    if (vv.busy || e.touches.length !== 1 || e.target.closest('button')) return;
    const t = e.touches[0];
    const r = vv.cur.getBoundingClientRect();
    if (t.clientY > r.bottom - 70 && t.clientY <= r.bottom + 10) return;
    vv.sx = t.clientX; vv.sy = t.clientY; vv.t0 = Date.now(); vv.dy = 0; vv.track = true;
  }, { passive: true });
  box.addEventListener('touchmove', (e) => {
    if (!vv.track || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - vv.sx, dy = t.clientY - vv.sy;
    if (!vv.drag) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { vv.drag = true; vv.cur.classList.remove('anim'); }
      else if (Math.abs(dx) > 10) { vv.track = false; return; }
      else return;
    }
    e.preventDefault();
    vv.dy = dy;
    vv.cur.style.transform = `translateY(${dy}px)`;
  }, { passive: false });
  box.addEventListener('touchend', () => {
    if (!vv.track) return;
    vv.track = false;
    if (!vv.drag) return;
    vv.drag = false;
    const dy = vv.dy, fast = Math.abs(dy) > 30 && Math.abs(dy) / Math.max(1, Date.now() - vv.t0) > 0.5;
    if (vvMany() && (Math.abs(dy) > 80 || fast)) vvSlide(dy < 0 ? 1 : -1);
    else vvSnapBack();
  }, { passive: true });
  box.addEventListener('touchcancel', () => { if (vv.drag) { vv.drag = false; vvSnapBack(); } vv.track = false; }, { passive: true });
})();
function moreVideos(btn) {
  const grid = document.getElementById('videoGrid');
  if (!grid || !vid.list) return;
  const next = vid.list.slice(vid.shown, vid.shown + VIDEO_BATCH);
  vid.shown += next.length;
  grid.insertAdjacentHTML('beforeend', next.map(videoCard).join(''));
  if (vid.shown >= vid.list.length && btn) btn.remove();
}
function viewVideos() {
  loadVideos();
  let body;
  if (vid.failed) body = `<p class="t-sm text-errink">We couldn’t load the videos.</p>`;
  else if (!vid.list) body = `<div class="grid grid-cols-2 gap-3 md:grid-cols-3 md:gap-4 lg:grid-cols-4">${'<div class="skel aspect-[4/5] rounded-tile"></div>'.repeat(4)}</div>`;
  else if (!vid.list.length) body = `<p class="t-base text-secondary">Videos are coming soon.</p>`;
  else body = `
    <div id="videoGrid" class="grid grid-cols-2 gap-3 md:grid-cols-3 md:gap-4 lg:grid-cols-4">${vid.list.slice(0, vid.shown).map(videoCard).join('')}</div>
    ${vid.list.length > vid.shown ? `<div class="mt-6 text-center"><button type="button" data-act="more-videos" class="${btnSecondary}">Show more videos</button></div>` : ''}`;
  return `
  <section class="space-y-6 text-primary">
    <header class="space-y-3">
      <h1 class="font-display text-[length:var(--fs-h1)] font-semibold leading-[1.1] tracking-[-0.02em] text-primary">Videos</h1>
      <p class="t-base leading-8 text-secondary">Local America videos.</p>
    </header>
    ${body}
  </section>`;
}

// ================= ADD TO HOME SCREEN CARD (footer of every page) =================
function renderInstall() {
  const box = $('#installCard');
  if (!box) return;
  if (isStandalone || state.installed) { box.innerHTML = ''; return; }
  if (!onHomePage || visitCount < 3) { box.innerHTML = ''; return; }
  const android = /Android/i.test(ua);
  const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let inner;
  if (inAppBrowser) {
    inner = `
      <div class="mt-3">
        <p class="t-sm text-secondary">Open this page in your phone’s browser to add it to your home screen.</p>
        ${android ? `<div class="mt-3"><button type="button" data-act="open-browser" class="${btnPrimaryLg}">${icon('external', 'ico-sm')}Open in browser</button></div>` : ''}
        <p class="mt-3 t-sm text-secondary">${android ? 'If nothing happens, tap' : 'Tap'} the menu (⋮ or •••) and choose “Open in browser”.</p>
      </div>`;
  } else {
    const steps = ios
      ? `<li>Tap the Share button <span class="inline-flex align-text-bottom">${icon('share', 'ico-sm')}</span> at the bottom (or top) of Safari.</li><li>Scroll down and tap “Add to Home Screen”.</li><li>Tap “Add”.</li>`
      : `<li>Tap the menu (⋮) in your browser.</li><li>Tap “Add to Home screen” (or “Install app”).</li><li>Tap “Add” or “Install”.</li>`;
    inner = `
      <div class="mt-3"><button type="button" data-act="install" class="${btnPrimaryLg}">${icon('plus', 'ico-sm')}Add to Home Screen</button></div>
      ${state.steps && !state.installEvent ? `<ol class="mt-3 list-decimal space-y-1 pl-5 t-sm text-secondary">${steps}</ol>` : ''}`;
  }
  box.innerHTML = `
  <section aria-label="Add to home screen" class="mt-4 rounded-card bg-white p-5 text-primary shadow-card">
    <div class="flex items-start gap-3">
      <span class="mt-1 shrink-0 text-secondary">${icon('phone', 'ico-md')}</span>
      <div class="min-w-0 flex-1">
        <p class="t-base font-semibold">Keep Local America on your phone</p>
        <p class="mt-1 t-sm text-secondary">Add it to your home screen and open it like any other app.</p>
        ${inner}
      </div>
    </div>
  </section>`;
}

// ================= ROUTER =================
// Show the small flag logo on every page except Home and About (those already show the big logo)
function syncMiniLogo(page) {
  const el = document.getElementById('mini-logo');
  if (el) el.hidden = !['list', 'p', 'safety', 'privacy', 'videos'].includes(page);
}
// Footer notes show only on place pages; the home-screen card shows on the home page after a few visits
let onHomePage = false;
function syncFooter(a) {
  onHomePage = !a;
  const onPlace = a === 'p';
  ['footNote', 'footStart'].forEach((id) => { const el = document.getElementById(id); if (el) el.hidden = !onPlace; });
  renderInstall();
}
let lastRouteKey = '';
function render() {
  const view = $('#view');
  if (state.error) {
    view.innerHTML = `<div class="text-center"><p class="t-sm text-errink">We couldn’t load the field records.</p><button type="button" data-act="reload" class="mt-3 t-sm font-medium text-errink underline">Try again</button></div>`;
    return;
  }
  if (!state.ready) {
    const pg = (location.hash.slice(1) || '/').split('/')[1];
    view.dataset.page = (pg === 'c' || pg === 'places' || pg === 'towns') ? 'list' : (pg || 'home');
    syncMiniLogo(view.dataset.page);
    view.innerHTML = `
    <div class="space-y-6" aria-busy="true">
      <p class="sr-only" role="status">Loading field records…</p>
      <div class="skel mx-auto h-24 w-2/3 rounded-2xl"></div>
      <div class="grid grid-cols-2 gap-3">
        <div class="skel col-span-2 aspect-[16/10] rounded-tile"></div>
        ${'<div class="skel aspect-[4/5] rounded-tile"></div>'.repeat(4)}
      </div>
    </div>`;
    return;
  }

  const [, a, b] = (location.hash.slice(1) || '/').split('/');
  const key = `${a || ''}/${b || ''}`;
  const wasCatNear = state.catNear;
  // The old Near Me page is gone; anyone with it saved or bookmarked lands on the home page
  if (a === 'near') { location.hash = '#/'; return; }
  if (key !== lastRouteKey) { state.shown = CFG.PAGE_SIZE; state.cardAsk = null; state.catNear = false; }

  let html;
  if (a === 'c' && b) {
    const cat = catBySlug(decodeURIComponent(b));
    if (!cat) { location.hash = '#/'; return; }
    html = viewList(cat);
  }
  else if (a === 'places') html = viewList(null);
  else if (a === 'p' && b) html = viewPlace(b);
  else if (a === 'about') html = viewAbout();
  else if (a === 'safety') html = viewSafety();
  else if (a === 'privacy') html = viewPrivacy();
  else if (a === 'towns') html = viewTowns();
  else if (a === 'videos') { vid.shown = key === lastRouteKey ? vid.shown : VIDEO_BATCH; html = viewVideos(); }
  else html = viewHome();
  view.dataset.page = (a === 'c' || a === 'places' || a === 'towns') ? 'list' : (a || 'home');
  view.innerHTML = html;
  syncMiniLogo(view.dataset.page);
  syncFooter(a);

  // Active tab = soft green pill (no tab is lit on place and place-type pages)
  const active = !a ? 'home' : a === 'videos' ? 'videos' : (a === 'about' || a === 'safety' || a === 'privacy') ? 'about' : '';
  document.querySelectorAll('[data-nav]').forEach((el) => {
    if (el.dataset.nav === active) el.setAttribute('aria-current', 'page');
    else el.removeAttribute('aria-current');
  });

  if (key !== lastRouteKey) {
    const cameFrom = lastRouteKey;
    lastRouteKey = key; window.scrollTo(0, 0);
    view.classList.remove('view-enter'); void view.offsetWidth; view.classList.add('view-enter');
    if (a === 'about' && b === 'contact') { const c = document.getElementById('contact'); if (c) c.scrollIntoView(); }
    if (a === 'p' && b) {
      // Note when the place was opened from a Near me list, so the Traffic page can see if Near me leads anywhere
      const meta = cameFrom.startsWith('c/') && wasCatNear ? { source: 'near_me_category' } : {};
      logEvent('place_view', Number(b), meta);
    } else if (a === 'c' && b) {
      const cat = catBySlug(decodeURIComponent(b));
      logEvent('category_view', null, cat ? { category: cat.name } : {});
    }
  }
}

// ================= PHOTO VIEWER (pinch, scroll or double-tap to zoom; drag to look around) =================
const pv = { photos: [], full: [], i: 0, alt: '', scale: 1, x: 0, y: 0, pts: new Map(),
  g: { startDist: 1, startScale: 1, downX: 0, downY: 0, panX: 0, panY: 0, moved: false, lastTap: 0 } };

function pvSet(scale, x, y) {
  const img = $('#pvImg'), stage = $('#pvStage');
  const s = Math.min(5, Math.max(1, scale));
  if (s === 1) { x = 0; y = 0; }
  else {
    const lx = Math.max(0, (img.offsetWidth * s - stage.clientWidth) / 2);
    const ly = Math.max(0, (img.offsetHeight * s - stage.clientHeight) / 2);
    x = Math.min(lx, Math.max(-lx, x)); y = Math.min(ly, Math.max(-ly, y));
  }
  pv.scale = s; pv.x = x; pv.y = y;
  img.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
  img.style.cursor = s > 1 ? 'grab' : 'zoom-in';
}
function pvShow() {
  const many = pv.photos.length > 1, img = $('#pvImg');
  img.dataset.full = pv.full[pv.i] || '';
  img.src = pv.photos[pv.i]; img.alt = pv.alt;
  pv.pts.clear(); pvSet(1, 0, 0);
  $('#pvPrev').classList.toggle('hidden', !many);
  $('#pvNext').classList.toggle('hidden', !many);
  $('#pvCap').textContent = (many ? `${pv.i + 1} of ${pv.photos.length} · ` : '') + 'Pinch or scroll to zoom, drag to look around';
}
function pvOpen(photos, i, alt, full = []) {
  if (!photos.length) return;
  pv.photos = photos; pv.full = full; pv.i = Math.min(Math.max(0, i || 0), photos.length - 1); pv.alt = alt;
  $('#pv').classList.remove('hidden'); document.body.style.overflow = 'hidden';
  pvShow();
}
function pvClose() { $('#pv').classList.add('hidden'); document.body.style.overflow = ''; $('#pvImg').removeAttribute('src'); }
function pvGo(step) { pv.i = (pv.i + step + pv.photos.length) % pv.photos.length; pvShow(); }
const pvOpenNow = () => !$('#pv').classList.contains('hidden');

(function wirePhotoViewer() {
  const stage = $('#pvStage'), g = pv.g;
  const dist = () => { const [a, b] = Array.from(pv.pts.values()); return Math.hypot(a.x - b.x, a.y - b.y); };
  stage.addEventListener('pointerdown', (e) => {
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* fine */ }
    pv.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pv.pts.size === 1) { g.moved = false; g.downX = e.clientX; g.downY = e.clientY; g.panX = pv.x; g.panY = pv.y; }
    else if (pv.pts.size === 2) { g.startDist = dist() || 1; g.startScale = pv.scale; g.moved = true; }
  });
  stage.addEventListener('pointermove', (e) => {
    if (!pv.pts.has(e.pointerId)) return;
    pv.pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pv.pts.size === 2) pvSet((g.startScale * dist()) / g.startDist, pv.x, pv.y);
    else if (pv.pts.size === 1) {
      const dx = e.clientX - g.downX, dy = e.clientY - g.downY;
      if (Math.hypot(dx, dy) > 6) g.moved = true;
      if (pv.scale > 1) pvSet(pv.scale, g.panX + dx, g.panY + dy);
    }
  });
  const end = (e) => {
    if (!pv.pts.has(e.pointerId)) return;
    pv.pts.delete(e.pointerId);
    if (pv.pts.size === 1) {
      // One finger left after a pinch: keep panning from where it is now
      const [rest] = Array.from(pv.pts.values());
      g.downX = rest.x; g.downY = rest.y; g.panX = pv.x; g.panY = pv.y;
      return;
    }
    if (pv.pts.size > 0 || g.moved || e.type === 'pointercancel') return;
    // A plain tap: outside the photo closes, a double tap on the photo zooms
    const r = $('#pvImg').getBoundingClientRect();
    const onImage = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (!onImage) return pvClose();
    const now = Date.now();
    if (now - g.lastTap < 320) { g.lastTap = 0; pv.scale > 1 ? pvSet(1, 0, 0) : pvSet(2.5, 0, 0); }
    else g.lastTap = now;
  };
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', (e) => { e.preventDefault(); pvSet(pv.scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15), pv.x, pv.y); }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (!pvOpenNow()) return;
    if (e.key === 'Escape') pvClose();
    else if (e.key === 'ArrowLeft' && pv.photos.length > 1) pvGo(-1);
    else if (e.key === 'ArrowRight' && pv.photos.length > 1) pvGo(1);
  });
})();

// ================= EVENTS =================
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'pv-close') return pvClose();
  if (act === 'pv-prev') return pvGo(-1);
  if (act === 'pv-next') return pvGo(1);
  if (act === 'pv-in') return pvSet(pv.scale * 1.5, pv.x, pv.y);
  if (act === 'pv-out') return pvSet(pv.scale / 1.5, pv.x, pv.y);
  if (act === 'pv-open') {
    const l = state.locs.find((x) => String(x.id) === String(el.dataset.id));
    if (!l) return;
    const keys = (state.photos[l.id] || []).map((p) => p.object_key);
    return pvOpen(keys.map((k) => sizedUrl(k, 1600)), Number(el.dataset.i), `${l.name} field photo`, keys.map((k) => photoUrl(k)));
  }
  if (act === 'reload') return location.reload();
  if (act === 'unlock') return startUnlock(Number(el.dataset.id));
  if (act === 'cat-near-on') { state.catNear = true; state.shown = CFG.PAGE_SIZE; return state.distances ? render() : findMe(); }
  if (act === 'cat-near-off') { state.catNear = false; state.shown = CFG.PAGE_SIZE; return render(); }
  if (act === 'more-videos') return moreVideos(el);
  if (act === 'vv-open') return vvOpen(el.dataset.f, el.dataset.solo === '1');
  if (act === 'vv-close') return vvClose();
  if (act === 'vv-prev') return vvGo(-1);
  if (act === 'vv-next') return vvGo(1);
  if (act === 'more') { state.shown += CFG.PAGE_SIZE; return render(); }
  if (act === 'dist') {
    // First tap: find the phone and show straight-line miles on every card
    if (!state.distances) { state.cardAsk = Number(el.dataset.id); return findMe(); }
    return;
  }
  if (act === 'maps') { logEvent('open_in_maps', Number(el.dataset.id)); return; }
  if (act === 'open-browser') {
    // Asks Android to open this exact page in the phone's default browser.
    // Facebook's browser may ignore it, so the menu tip stays underneath.
    const { host, pathname, search, hash } = location;
    location.href = `intent://${host}${pathname}${search}${hash}#Intent;scheme=https;action=android.intent.action.VIEW;end`;
    return;
  }
  if (act === 'install') {
    if (state.installEvent) {
      try {
        state.installEvent.prompt();
        const choice = await state.installEvent.userChoice;
        if (choice && choice.outcome === 'accepted') state.installed = true;
      } catch (err) { state.steps = true; }
      state.installEvent = null;
    } else {
      state.steps = !state.steps;
    }
    return renderInstall();
  }
});

window.addEventListener('hashchange', render);

// If someone backs out of Stripe, don't leave the button stuck on "Opening…"
window.addEventListener('pageshow', (e) => { if (e.persisted && state.busy) { state.busy = null; render(); } });

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); state.installEvent = e; renderInstall();
  try { if (!sessionStorage.getItem('la_ip')) { sessionStorage.setItem('la_ip', '1'); logEvent('install_prompt_shown'); } } catch (err) { /* fine */ }
});
window.addEventListener('appinstalled', () => { state.installed = true; state.installEvent = null; renderInstall(); toast('App installed'); logEvent('app_installed'); });
renderInstall();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

// ================= START =================
render();
loadData()
  .then(async () => {
    render();
    logEvent('app_open', null, { standalone: isStandalone, inAppBrowser });
    await handleCheckoutReturn();
    await loadUnlocked();
    render();
  })
  .catch((err) => { state.error = err.message || String(err); render(); });
</script>
