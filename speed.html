<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>speed</title>
<body style="font:14px monospace;padding:10px"><div id="o">running…</div>
<script>
const o=document.getElementById('o'); const out=[];
const img=(u)=>new Promise(ok=>{const t=performance.now(),i=new Image();i.onload=()=>ok([performance.now()-t,i.naturalWidth]);i.onerror=()=>ok([-1,0]);i.src=u+(u.includes('?')?'&':'?')+'_r='+Math.random();});
const MERC=20037508.342789244;
const bbox=(z,x,y)=>{const s=2*MERC/2**z;return [-MERC+x*s,MERC-(y+1)*s,-MERC+(x+1)*s,MERC-y*s].join(',')};
async function batch(name, urls){const t=performance.now();const r=await Promise.all(urls.map(img));const w=performance.now()-t;const ok=r.filter(x=>x[0]>=0);
 out.push(`${name}: ${ok.length}/${urls.length} ok, slowest ${Math.round(Math.max(...ok.map(x=>x[0])))} ms, median ${Math.round(ok.map(x=>x[0]).sort((a,b)=>a-b)[ok.length>>1])} ms, px ${ok[0]&&ok[0][1]}`);o.innerHTML=out.join('<br>');}
// Mountain Grove area, z15 x=7790..7792 y=12767..12769 ; z12 x=973..975 y=1595..1597
const t15=[],t12=[];for(let dx=0;dx<3;dx++)for(let dy=0;dy<3;dy++){t15.push([15,7590+dx,12867+dy]);t12.push([12,948+dx,1608+dy]);}
(async()=>{
await batch('USGS photo z12 (9)', t12.map(([z,x,y])=>`https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/${z}/${y}/${x}`));
await batch('USGS photo z15 (9)', t15.map(([z,x,y])=>`https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/${z}/${y}/${x}`));
await batch('NAIP sharp z15 (9)', t15.map(([z,x,y])=>`https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer/exportImage?f=image&format=jpg&bboxSR=3857&imageSR=3857&size=512,512&renderingRule=${encodeURIComponent('{"rasterFunction":"NaturalColor"}')}&bbox=${bbox(z,x,y)}`));
await batch('NAIPPlus tile z15 (9)', t15.map(([z,x,y])=>`https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPPlus/ImageServer/tile/${z}/${y}/${x}`));
await batch('Esri photo z15 (9) compare', t15.map(([z,x,y])=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`));
let t=performance.now(); try{const r=await fetch('https://carto.nationalmap.gov/arcgis/rest/services/transportation/MapServer/32/query?f=json&where=1%3D1&geometry=-92.3,37.1,-92.2,37.2&geometryType=esriGeometryEnvelope&inSR=4326&outSR=4326&returnGeometry=true&resultRecordCount=2000&outFields=name&maxAllowableOffset=0.00002&_r='+Math.random());const j=await r.json();out.push(`USGS town streets query: ${Math.round(performance.now()-t)} ms, ${(j.features||[]).length} roads`);}catch(e){out.push('USGS query failed '+e)}
t=performance.now(); try{const r=await fetch('/trails-data/places-mo.bin?_r='+Math.random(),{headers:{Range:'bytes=0-60000'}});await r.arrayBuffer();out.push(`Our own site file piece: ${Math.round(performance.now()-t)} ms`);}catch(e){out.push('site failed')}
out.push('DONE');o.innerHTML=out.join('<br>');
})();
</script>
