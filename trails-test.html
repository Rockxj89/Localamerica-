<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trails test map · Local America</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --ink: #1c1917; --muted: #57534e; --bg: #faf7f2; --fs-car: #15803d; --fs-hc: #92400e; --fs-ohv: #ea580c; --fs-trail: #dc2626; --osm: #7c3aed; --place: #0f172a; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
  header { padding: 10px 14px; background: #111; color: #f5e6c8; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header a { color: #f5e6c8; font-size: 14px; }
  #map { flex: 1; }
  #note { position: absolute; left: 50%; transform: translateX(-50%); top: 64px; z-index: 1000; background: rgba(17,17,17,.85); color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 14px; display: none; white-space: nowrap; }
  .legend { background: #fff; padding: 8px 10px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.25); font-size: 13px; line-height: 1.5; max-width: 220px; }
  .legend b { display: block; margin-bottom: 2px; }
  .legend .row { display: flex; align-items: center; gap: 6px; }
  .legend .sw { width: 22px; height: 0; border-top: 4px solid; flex: none; }
  .legend .dash { border-top-style: dashed; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--place); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--place); margin: 0 6px; }
  .legend button { margin-top: 4px; font: inherit; font-size: 12px; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; }
  .pop h3 { margin: 0 0 4px; font-size: 16px; }
  .pop .src { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .pop ul { margin: 4px 0 0; padding-left: 18px; }
  .pop .warn { color: #b91c1c; }
  .locate { background: #fff; border-radius: 4px; width: 34px; height: 34px; display: grid; place-items: center; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Trails test map</h1>
  <a href="/">Back to Local America</a>
</header>
<div id="note"></div>
<div id="map"></div>
<script>
// Test page only. Not linked from the app. Shows:
// 1) Forest Service roads and trails open to vehicles (Motor Vehicle Use Map), read live from the Forest Service.
// 2) OpenStreetMap dirt tracks, gravel roads and trails (a saved copy for south-central Missouri).
// 3) Free Local America places (paid places have no public GPS, so they are not shown).
const SUPABASE_URL = 'https://ycdlxdijrlfsxvxksyrq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2ExdXbNtW9HpuOGAq1Oa7g_gPdONH_s';
const MVUM = 'https://apps.fs.usda.gov/arcx/rest/services/EDW/EDW_MVUM_02/MapServer/';
const FS_MIN_ZOOM = 11;

const map = L.map('map', { zoomControl: true, preferCanvas: true }).setView([36.95, -92.15], 12);
// OpenStreetMap lines draw on a canvas at the bottom; Forest Service lines and places draw on top as SVG,
// which lets taps fall through to the canvas where nothing is drawn.
const renderer = L.canvas({ tolerance: 10 });
map.createPane('fsPane').style.zIndex = 420;
map.createPane('placesPane').style.zIndex = 450;
const fsRenderer = L.svg({ pane: 'fsPane' });
const placesRenderer = L.svg({ pane: 'placesPane' });

const topo = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, attribution: 'Base map: USGS The National Map'
}).addTo(map);
const imagery = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, attribution: 'Base map: USGS The National Map'
});

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const note = (msg) => { const n = document.getElementById('note'); n.textContent = msg || ''; n.style.display = msg ? 'block' : 'none'; };

// ---------- Forest Service (MVUM) ----------
const fsRoads = L.layerGroup().addTo(map);
const fsTrails = L.layerGroup().addTo(map);
const fsSeen = { 1: new Set(), 2: new Set() };

const VEHICLES = [
  ['passengervehicle', 'passengervehicle_datesopen', 'Any car'],
  ['highclearancevehicle', 'highclearancevehicle_datesopen', 'High-clearance (Jeep, truck)'],
  ['fourwd_gt50inches', 'fourwd_gt50_datesopen', '4WD wider than 50 in'],
  ['atv', 'atv_datesopen', 'ATV'],
  ['otherwheeled_ohv', 'otherwheeled_ohv_datesopen', 'UTV / side-by-side'],
  ['motorcycle', 'motorcycle_datesopen', 'Motorcycle']
];
const isOpen = (v) => v != null && String(v).trim() !== '' && !/^(n|no|null)$/i.test(String(v).trim());
function openTo(a) {
  return VEHICLES.filter(([f]) => isOpen(a[f])).map(([f, d, label]) => {
    const dates = a[d] && String(a[d]).trim();
    return { label, dates: dates && !/^(01\/01-12\/31|1\/1-12\/31)$/.test(dates) ? dates : '' };
  });
}
const isSeasonal = (a) => /seasonal/i.test(String(a.seasonal || '')) || openTo(a).some((o) => o.dates);
const isRough = (a) => /^\s*[12]\b/.test(String(a.operationalmaintlevel || ''));
function fsStyle(a, layerId) {
  const who = openTo(a).map((o) => o.label);
  let color;
  if (layerId === 2) color = '#dc2626';
  else if (who.some((w) => /ATV|UTV/.test(w))) color = '#ea580c';
  else if (isRough(a) || (!who.includes('Any car') && who.length)) color = '#92400e';
  else color = '#15803d';
  return { renderer: fsRenderer, pane: 'fsPane', color, weight: 4, opacity: 0.9, dashArray: layerId === 2 ? '8 6' : (isSeasonal(a) ? '2 6' : null) };
}
function fsPopup(a, layerId) {
  const who = openTo(a);
  const name = a.name && a.name.trim() ? a.name : (a.id ? (layerId === 2 ? 'Trail ' : 'Forest Road ') + a.id : 'Forest Service route');
  const miles = a.gis_miles != null ? Number(a.gis_miles).toFixed(1) + ' miles' : '';
  const list = who.length ? '<ul>' + who.map((o) => `<li>${esc(o.label)}${o.dates ? ' · open ' + esc(o.dates) : ''}</li>`).join('') + '</ul>' : '<p class="warn">The Forest Service lists no vehicles for this one.</p>';
  const tidy = (v) => String(v || '').replace(/^[A-Z0-9]+\s*-\s*/, '').toLowerCase();
  const surface = a.surfacetype ? `<div>Surface: ${esc(tidy(a.surfacetype))}</div>` : '';
  const upkeep = isRough(a) ? '<div>Rough road: high clearance suggested</div>' : '';
  const season = isSeasonal(a) ? '<div class="warn">Seasonal: check the dates below</div>' : '';
  return `<div class="pop"><h3>${esc(name)}</h3>${miles ? `<div>${miles}${layerId === 2 ? ' · motorized trail' : ''}</div>` : ''}${surface}${upkeep}${season}<div style="margin-top:4px"><b>Open to:</b>${list}</div>
    <div class="src">Source: Forest Service Motor Vehicle Use Map. "Open" means legal, not that it's passable today.</div></div>`;
}
function esriToLatLngs(g) { return (g && g.paths ? g.paths : []).map((p) => p.map(([x, y]) => [y, x])); }

let jsonpN = 0;
function jsonp(url, timeoutMs = 20000) {
  return new Promise((resolve, reject) => {
    const cb = '__fs' + (++jsonpN);
    const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, timeoutMs);
    function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('load')); };
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}
async function loadFs() {
  if (map.getZoom() < FS_MIN_ZOOM) { note('Zoom in to see Forest Service roads'); return; }
  note('Loading Forest Service roads…');
  const b = map.getBounds().pad(0.2);
  const env = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map((n) => n.toFixed(5)).join(',');
  let hitLimit = false, failed = false;
  await Promise.all([[1, fsRoads], [2, fsTrails]].map(async ([id, group]) => {
    const url = `${MVUM}${id}/query?where=1%3D1&geometry=${env}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&returnGeometry=true&outSR=4326&maxAllowableOffset=0.00004&f=json`;
    try {
      const data = await jsonp(url);
      if (data.error) throw new Error(data.error.message || 'error');
      if (data.exceededTransferLimit) hitLimit = true;
      (data.features || []).forEach((f) => {
        const a = f.attributes || {};
        const key = a.objectid ?? a.OBJECTID ?? JSON.stringify(f.geometry && f.geometry.paths && f.geometry.paths[0] && f.geometry.paths[0][0]);
        if (fsSeen[id].has(key)) return;
        fsSeen[id].add(key);
        const ll = esriToLatLngs(f.geometry);
        L.polyline(ll, fsStyle(a, id)).bindPopup(() => fsPopup(a, id)).addTo(group);
        // Wide invisible copy so the line is easy to tap with a finger
        L.polyline(ll, { renderer: fsRenderer, pane: 'fsPane', weight: 20, opacity: 0, color: '#000' }).bindPopup(() => fsPopup(a, id)).addTo(group);
      });
    } catch (e) { failed = true; }
  }));
  note(failed ? "The Forest Service map didn't answer. Try moving the map again." : hitLimit ? 'Zoom in a bit to load every Forest Service road here' : '');
}
let fsTimer;
map.on('moveend', () => { clearTimeout(fsTimer); fsTimer = setTimeout(loadFs, 300); });

// ---------- OpenStreetMap tracks ----------
const OSM_COLORS = { 'Dirt track': '#7c3aed', 'Dirt road': '#7c3aed', 'Unpaved road': '#a78bfa', 'Gravel road': '#a78bfa', 'Trail': '#0891b2', 'Horse trail': '#0891b2' };
const osm = L.layerGroup().addTo(map);
fetch('/trails-test/osm-tracks.json').then((r) => r.json()).then((fc) => {
  L.geoJSON(fc, {
    style: (f) => ({ renderer, color: OSM_COLORS[f.properties.k] || '#7c3aed', weight: f.properties.k === 'Dirt track' ? 3 : 2.5, opacity: 0.85, dashArray: /Trail/.test(f.properties.k) ? '4 4' : null }),
    onEachFeature: (f, layer) => {
      const p = f.properties;
      layer.bindPopup(`<div class="pop"><h3>${esc(p.n || 'Unnamed ' + p.k.toLowerCase())}</h3><div>${esc(p.k)} · ${Number(p.mi).toFixed(1)} miles in this piece</div>
        <div class="src">Source: © OpenStreetMap contributors. Doesn't say who it's open to, and some tracks are private land.</div></div>`);
    }
  }).addTo(osm);
}).catch(() => note("Couldn't load the OpenStreetMap tracks"));

// ---------- Free places ----------
const places = L.layerGroup().addTo(map);
fetch(`${SUPABASE_URL}/rest/v1/poi_public_locations?select=id,name,category,access,latitude,longitude`, {
  headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
}).then((r) => r.json()).then((rows) => {
  (rows || []).filter((l) => l.latitude != null && l.longitude != null).forEach((l) => {
    L.circleMarker([l.latitude, l.longitude], { renderer: placesRenderer, pane: 'placesPane', radius: 7, color: '#fff', weight: 2, fillColor: '#0f172a', fillOpacity: 1 })
      .bindPopup(`<div class="pop"><h3>${esc(l.name)}</h3><div>${esc(l.category)} · Free</div><div style="margin-top:4px"><a href="/#/p/${encodeURIComponent(l.id)}">Open in Local America</a></div></div>`)
      .addTo(places);
  });
}).catch(() => {});

// ---------- Controls ----------
L.control.layers({ 'Topo map': topo, 'Satellite': imagery }, {
  'Forest Service roads': fsRoads, 'Forest Service trails': fsTrails, 'OpenStreetMap tracks': osm, 'Free places': places
}, { collapsed: true }).addTo(map);
map.attributionControl.addAttribution('Roads and trails: Forest Service MVUM; © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors');

const Legend = L.Control.extend({
  options: { position: 'bottomleft' },
  onAdd() {
    const d = L.DomUtil.create('div', 'legend');
    const full = `<b>Forest Service (who's allowed)</b>
      <div class="row"><span class="sw" style="border-color:#15803d"></span>Any car</div>
      <div class="row"><span class="sw" style="border-color:#92400e"></span>Rough, high clearance (Jeep)</div>
      <div class="row"><span class="sw" style="border-color:#ea580c"></span>ATVs and UTVs too</div>
      <div class="row"><span class="sw dash" style="border-color:#dc2626"></span>Motorized trail (50 in or less)</div>
      <div class="row"><span class="sw" style="border-color:#888;border-top-style:dotted"></span>Seasonal</div>
      <b style="margin-top:6px">OpenStreetMap</b>
      <div class="row"><span class="sw" style="border-color:#7c3aed"></span>Dirt track</div>
      <div class="row"><span class="sw" style="border-color:#a78bfa"></span>Gravel or dirt road</div>
      <div class="row"><span class="sw dash" style="border-color:#0891b2"></span>Foot or horse trail</div>
      <div class="row"><span class="dot"></span>Free place</div>
      <button type="button">Hide key</button>`;
    const small = `<button type="button">Show key</button>`;
    let open = window.innerWidth > 500;
    const draw = () => { d.innerHTML = open ? full : small; d.querySelector('button').onclick = (e) => { e.stopPropagation(); open = !open; draw(); }; };
    draw();
    L.DomEvent.disableClickPropagation(d);
    return d;
  }
});
map.addControl(new Legend());

const Locate = L.Control.extend({
  options: { position: 'topleft' },
  onAdd() {
    const d = L.DomUtil.create('div', 'leaflet-bar locate');
    d.title = 'Show where I am'; d.textContent = '◎';
    let dot;
    d.onclick = (e) => {
      e.stopPropagation();
      if (!navigator.geolocation) return note('This phone has no location');
      note('Finding you…');
      navigator.geolocation.getCurrentPosition((p) => {
        const ll = [p.coords.latitude, p.coords.longitude];
        if (dot) dot.remove();
        dot = L.circleMarker(ll, { renderer: placesRenderer, pane: 'placesPane', radius: 8, color: '#fff', weight: 3, fillColor: '#2563eb', fillOpacity: 1 }).addTo(map);
        map.setView(ll, Math.max(map.getZoom(), 13)); note('');
      }, () => note("Couldn't get your location"), { enableHighAccuracy: true, timeout: 15000 });
    };
    return d;
  }
});
map.addControl(new Locate());

loadFs();
</script>
</body>
</html>
