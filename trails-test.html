<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trails test map · Local America</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --ink: #1c1917; --muted: #57534e; --drive: #f97316; --dirt: #a8a29e; --me: #2563eb; --pin: #111827; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #faf7f2; display: flex; flex-direction: column; }
  header { padding: 10px 14px; background: #111; color: #f5e6c8; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header a { color: #f5e6c8; font-size: 14px; }
  #map { flex: 1; min-height: 0; }
  /* Fade the base map so the trails stand out */
  .base-topo { filter: saturate(.35) brightness(1.06) contrast(.9); }
  #note { position: absolute; left: 50%; transform: translateX(-50%); top: 60px; z-index: 1000; background: rgba(17,17,17,.88); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 15px; display: none; max-width: 88vw; text-align: center; }
  .key { position: absolute; left: 10px; right: 10px; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 1000; margin: 0 auto; max-width: 420px; background: rgba(255,255,255,.95); border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,.25); padding: 8px 12px; font-size: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; pointer-events: none; }
  .key span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .key i { display: inline-block; width: 22px; height: 0; border-top: 5px solid var(--drive); border-radius: 3px; }
  .key i.dirt { border-top: 3px solid var(--dirt); }
  .key i.pin { width: 12px; height: 12px; border: 0; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--pin); }
  .fab { position: absolute; right: 12px; z-index: 1000; width: 52px; height: 52px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); font-size: 13px; font-weight: 600; color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .fab svg { width: 24px; height: 24px; }
  #me-btn { bottom: calc(90px + env(safe-area-inset-bottom)); color: var(--me); }
  #sat-btn { bottom: calc(152px + env(safe-area-inset-bottom)); font-size: 12px; }
  .me-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(37,99,235,.35), 0 1px 4px rgba(0,0,0,.4); box-sizing: border-box; position: relative; }
  .me-dot::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; background: rgba(37,99,235,.25); animation: pulse 2s ease-out infinite; z-index: -1; }
  @keyframes pulse { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--pin); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); box-sizing: border-box; }
  .pop { font-size: 15px; }
  .pop h3 { margin: 0 0 4px; font-size: 17px; }
  .pop .big { font-weight: 600; }
  .pop .closed { color: #b91c1c; font-weight: 600; }
  .pop .small { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .pop a.btn { display: inline-block; margin-top: 8px; background: #15803d; color: #fff; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  .leaflet-control-zoom { display: none; }
  @media (min-width: 700px) { .leaflet-control-zoom { display: block; } }
</style>
</head>
<body>
<header>
  <h1>Trails near you</h1>
  <a href="/">Back to Local America</a>
</header>
<div id="note"></div>
<div id="map"></div>
<button class="fab" id="sat-btn" type="button" aria-label="Switch to satellite">Satellite</button>
<button class="fab" id="me-btn" type="button" aria-label="Show where I am">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
</button>
<div class="key"><span><i></i>Open to drive</span><span><i class="dirt"></i>Dirt road, not checked</span><span><i class="pin"></i>Local America place</span></div>
<script>
// Test page only. Not linked from the app. Simple version:
// - starts where you are (blue dot), or Willow Springs if location is off
// - orange = Forest Service roads and trails open to vehicles today
// - faint gray = OpenStreetMap dirt and gravel roads (nobody has checked who may drive them)
// - pins = free Local America places (paid places have no public GPS)
const SUPABASE_URL = 'https://ycdlxdijrlfsxvxksyrq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2ExdXbNtW9HpuOGAq1Oa7g_gPdONH_s';
const MVUM = 'https://apps.fs.usda.gov/arcx/rest/services/EDW/EDW_MVUM_02/MapServer/';
const FS_MIN_ZOOM = 11;
const WILLOW_SPRINGS = [36.9923, -91.9690];
const MISSOURI = L.latLngBounds([35.99, -95.77], [40.62, -89.10]);

const map = L.map('map', { zoomControl: true, preferCanvas: true, tap: true }).setView(WILLOW_SPRINGS, 12);
const renderer = L.canvas({ tolerance: 12 });
map.createPane('fsPane').style.zIndex = 420;
const fsRenderer = L.svg({ pane: 'fsPane' });

const topo = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, className: 'base-topo', attribution: 'Base map: USGS The National Map'
}).addTo(map);
const imagery = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 16, attribution: 'Base map: USGS The National Map'
});
map.attributionControl.setPrefix('');
map.attributionControl.addAttribution('Roads: Forest Service; © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors');

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let noteTimer;
const note = (msg, ms) => {
  const n = document.getElementById('note'); clearTimeout(noteTimer);
  n.textContent = msg || ''; n.style.display = msg ? 'block' : 'none';
  if (msg && ms) noteTimer = setTimeout(() => note(''), ms);
};
const titleCase = (t) => String(t).toLowerCase().replace(/\b([a-z])/g, (m) => m.toUpperCase()).replace(/'S\b/g, "'s");
const miles = (m) => (m < 0.1 ? 'under 0.1' : m < 10 ? m.toFixed(1) : Math.round(m)) + ' mi';

// ---------- Where am I ----------
let me = null, meMarker = null, followed = false;
const meIcon = L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [20, 20], iconAnchor: [10, 10] });
function showMe(ll) {
  me = L.latLng(ll);
  if (!meMarker) meMarker = L.marker(me, { icon: meIcon, interactive: false, zIndexOffset: 1000 }).addTo(map);
  else meMarker.setLatLng(me);
}
function startLocation(centerOnIt) {
  if (!navigator.geolocation) { fallback("This phone isn't sharing its location, so here's Willow Springs."); return; }
  if (centerOnIt) note('Finding you…');
  navigator.geolocation.watchPosition((p) => {
    showMe([p.coords.latitude, p.coords.longitude]);
    if (!followed || centerOnIt) {
      followed = true; centerOnIt = false;
      if (MISSOURI.contains(me)) { map.setView(me, 14); note(''); }
      else fallback("You're outside Missouri, where this test map has trails. Here's Willow Springs.");
    }
  }, () => { if (!followed) { followed = true; fallback('Location is off, so here is Willow Springs. Tap the blue button to try again.'); } },
  { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
}
function fallback(msg) { map.setView(WILLOW_SPRINGS, 12); note(msg, 6000); }
document.getElementById('me-btn').onclick = () => {
  if (me) { map.setView(me, Math.max(map.getZoom(), 14)); return; }
  followed = false; startLocation(true);
};
let sat = false;
document.getElementById('sat-btn').onclick = (e) => {
  sat = !sat;
  if (sat) { map.removeLayer(topo); imagery.addTo(map); e.currentTarget.textContent = 'Map'; }
  else { map.removeLayer(imagery); topo.addTo(map); e.currentTarget.textContent = 'Satellite'; }
};

// ---------- Places (pins) ----------
const placeList = [];
const pinIcon = L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [26, 26], iconAnchor: [3, 26], popupAnchor: [10, -24] });
fetch(`${SUPABASE_URL}/rest/v1/poi_public_locations?select=id,name,category,latitude,longitude`, {
  headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
}).then((r) => r.json()).then((rows) => {
  (rows || []).filter((l) => l.latitude != null && l.longitude != null).forEach((l) => {
    const ll = L.latLng(l.latitude, l.longitude);
    placeList.push({ name: l.name, ll });
    L.marker(ll, { icon: pinIcon, zIndexOffset: 500 }).bindPopup(() => {
      const away = me ? `<div>${miles(me.distanceTo(ll) / 1609.34)} from you</div>` : '';
      return `<div class="pop"><h3>${esc(l.name)}</h3><div>${esc(l.category || '')}</div>${away}<a class="btn" href="/#/p/${encodeURIComponent(l.id)}">Open in Local America</a></div>`;
    }).addTo(map);
  });
}).catch(() => {});

// Closest place to a line, and how far
function nearestPlace(latlngs) {
  const pts = latlngs.flat(3);
  const step = Math.max(1, Math.floor(pts.length / 40));
  let best = null;
  for (const p of placeList) {
    for (let i = 0; i < pts.length; i += step) {
      const d = p.ll.distanceTo(pts[i]);
      if (!best || d < best.d) best = { name: p.name, d };
    }
  }
  return best && best.d < 16000 ? best : null; // within about 10 miles
}
function lineMiles(latlngs) {
  let m = 0;
  (Array.isArray(latlngs[0]) ? latlngs : [latlngs]).forEach((seg) => { for (let i = 1; i < seg.length; i++) m += L.latLng(seg[i - 1]).distanceTo(seg[i]); });
  return m / 1609.34;
}
function placeAndYou(latlngs) {
  let out = '';
  const near = nearestPlace(latlngs);
  if (near) out += `<div>Leads toward <b>${esc(near.name)}</b>${near.d > 400 ? ' (' + miles(near.d / 1609.34) + ' away)' : ''}</div>`;
  if (me) {
    const pts = latlngs.flat(3); let d = Infinity;
    pts.forEach((p) => { d = Math.min(d, me.distanceTo(p)); });
    out += `<div>${d < 150 ? "You're on it" : miles(d / 1609.34) + ' from you'}</div>`;
  }
  return out;
}

// ---------- Forest Service roads and trails open to vehicles ----------
const fsLayer = L.layerGroup().addTo(map);
const fsSeen = { 1: new Set(), 2: new Set() };
const isOpen = (v) => v != null && String(v).trim() !== '' && !/^(n|no|null)$/i.test(String(v).trim());
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// Dates look like "04/01-12/15" (sometimes several, split by commas)
function ranges(s) {
  return String(s || '').split(/[,;]/).map((r) => r.trim().match(/^(\d{1,2})\/(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})$/)).filter(Boolean)
    .map((m) => ({ a: +m[1] * 100 + +m[2], b: +m[3] * 100 + +m[4], text: `${MONTHS[+m[1] - 1]} ${+m[2]} to ${MONTHS[+m[3] - 1]} ${+m[4]}` }));
}
function openToday(rs) {
  if (!rs.length) return true;
  const t = new Date(), today = (t.getMonth() + 1) * 100 + t.getDate();
  return rs.some(({ a, b }) => (a <= b ? today >= a && today <= b : today >= a || today <= b));
}
function fsInfo(a) {
  const jeep = isOpen(a.highclearancevehicle) || isOpen(a.fourwd_gt50inches);
  const car = isOpen(a.passengervehicle);
  const atv = isOpen(a.atv) || isOpen(a.otherwheeled_ohv);
  const moto = isOpen(a.motorcycle);
  if (!jeep && !car && !atv && !moto) return null;
  const dateField = car ? a.passengervehicle_datesopen : jeep ? (a.highclearancevehicle_datesopen || a.fourwd_gt50_datesopen) : atv ? (a.atv_datesopen || a.otherwheeled_ohv_datesopen) : a.motorcycle_datesopen;
  const rs = ranges(dateField).filter((r) => !(r.a === 101 && r.b === 1231));
  const label = car ? 'Any car' : jeep ? 'Jeep friendly' : atv ? 'ATV and side-by-side only' : 'Dirt bikes only';
  const extra = (car || jeep) && atv ? ', ATVs too' : '';
  return { label: label + extra, rough: /^\s*[12]\b/.test(String(a.operationalmaintlevel || '')), rs, open: openToday(rs) };
}
function fsPopup(a, info, latlngs, isTrail) {
  const num = a.id ? (isTrail ? 'Trail ' : 'Forest Road ') + a.id : '';
  const name = a.name && a.name.trim() ? titleCase(a.name) : (num || 'Forest Service road');
  const len = a.gis_miles != null ? Number(a.gis_miles) : lineMiles(latlngs);
  const season = !info.open ? `<div class="closed">Closed right now. Open ${esc(info.rs.map((r) => r.text).join(', '))}</div>`
    : info.rs.length ? `<div>Open ${esc(info.rs.map((r) => r.text).join(', '))}</div>` : '';
  return `<div class="pop"><h3>${esc(name)}</h3><div class="big">${esc(info.label)} · ${miles(len).replace(' mi', ' miles')}</div>${season}${info.rough && info.label === 'Any car' ? '<div>Rough in spots</div>' : ''}${placeAndYou(latlngs)}
    <div class="small">${esc(num && name !== num ? num + ' · ' : '')}From the Forest Service. Open means allowed, not that it's in good shape today.</div></div>`;
}
let jsonpN = 0;
function jsonp(url, timeoutMs = 20000) {
  return new Promise((resolve, reject) => {
    const cb = '__fs' + (++jsonpN);
    const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, timeoutMs);
    function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = (data) => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('load')); };
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}
async function loadFs() {
  if (map.getZoom() < FS_MIN_ZOOM) { note('Zoom in to see trails'); return; }
  const n = document.getElementById('note');
  if (n.textContent === 'Zoom in to see trails') note('');
  const b = map.getBounds().pad(0.2);
  const env = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map((x) => x.toFixed(5)).join(',');
  let failed = false;
  await Promise.all([1, 2].map(async (id) => {
    const url = `${MVUM}${id}/query?where=1%3D1&geometry=${env}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&returnGeometry=true&outSR=4326&maxAllowableOffset=0.00004&f=json`;
    try {
      const data = await jsonp(url);
      if (data.error) throw new Error('error');
      (data.features || []).forEach((f) => {
        const a = f.attributes || {};
        const key = a.objectid ?? a.OBJECTID ?? JSON.stringify(f.geometry && f.geometry.paths && f.geometry.paths[0] && f.geometry.paths[0][0]);
        if (fsSeen[id].has(key)) return;
        fsSeen[id].add(key);
        const info = fsInfo(a);
        if (!info) return;
        const ll = (f.geometry && f.geometry.paths ? f.geometry.paths : []).map((p) => p.map(([x, y]) => [y, x]));
        const pop = () => fsPopup(a, info, ll, id === 2);
        if (info.open) L.polyline(ll, { renderer: fsRenderer, pane: 'fsPane', color: '#fff', weight: 9, opacity: 0.9, interactive: false }).addTo(fsLayer);
        L.polyline(ll, { renderer: fsRenderer, pane: 'fsPane', color: info.open ? '#f97316' : '#9ca3af', weight: info.open ? 5 : 3, opacity: info.open ? 1 : 0.8, dashArray: info.open ? null : '6 6', interactive: false }).addTo(fsLayer);
        // Wide invisible copy so the line is easy to tap with a finger
        L.polyline(ll, { renderer: fsRenderer, pane: 'fsPane', weight: 24, opacity: 0, color: '#000' }).bindPopup(pop).addTo(fsLayer);
      });
    } catch (e) { failed = true; }
  }));
  if (failed) note("Couldn't load the Forest Service trails. Move the map to try again.", 5000);
}
let fsTimer;
map.on('moveend', () => { clearTimeout(fsTimer); fsTimer = setTimeout(loadFs, 300); });

// ---------- OpenStreetMap dirt and gravel roads (faint) ----------
const DIRT_KINDS = { 'Dirt track': 'Dirt track', 'Dirt road': 'Dirt road', 'Unpaved road': 'Gravel or dirt road', 'Gravel road': 'Gravel road' };
fetch('/trails-test/osm-tracks.json').then((r) => r.json()).then((fc) => {
  fc.features = fc.features.filter((f) => DIRT_KINDS[f.properties.k]);
  L.geoJSON(fc, {
    style: () => ({ renderer, color: '#a8a29e', weight: 3, opacity: 0.75 }),
    onEachFeature: (f, layer) => {
      const p = f.properties;
      layer.bindPopup(() => `<div class="pop"><h3>${esc(p.n || DIRT_KINDS[p.k])}</h3><div class="big">${esc(DIRT_KINDS[p.k])} · ${miles(Number(p.mi)).replace(' mi', ' miles')}</div>${placeAndYou(layer.getLatLngs())}
        <div class="small">Nobody has checked who may drive this one. Some are private land. Map data © OpenStreetMap contributors.</div></div>`);
    }
  }).addTo(map);
}).catch(() => {});

// ---------- Start ----------
// For checking the page: ?at=lat,lng skips location; ?open=fs or ?open=dirt opens one line's info box
const qs = new URLSearchParams(location.search);
const at = qs.get('at');
if (at) { const [la, lo] = at.split(',').map(Number); showMe([la, lo]); followed = true; map.setView(me, 14); }
else startLocation(false);
loadFs();
const openParam = qs.get('open');
if (openParam) setTimeout(() => {
  let first;
  const take = (l) => { if (!first && l.getPopup && l.getPopup()) first = l; };
  if (openParam === 'fs') fsLayer.eachLayer(take); else map.eachLayer((l) => { if (l.feature) take(l); });
  if (first) { const ll = first.getLatLngs().flat(3); first.openPopup(ll[Math.floor(ll.length / 2)]); }
}, 5000);
</script>
</body>
</html>
