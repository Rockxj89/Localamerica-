<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trails · Local America</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --tan: #f5e6c8; --gold: #f2b134; --ink: #1c1917; --muted: #57534e; --drive: #f5ecd7; --edge: #3b2f22; --dirt: #d9c7a3; --land: #22c55e; --me: #2563eb; --pin: #111827; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #faf7f2; display: flex; flex-direction: column; }
  header { padding: 10px 14px; background: #111; color: #f5e6c8; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header a { color: #f5e6c8; font-size: 14px; }
  #map { flex: 1; min-height: 0; }
  /* Fade the base map so the trails stand out */
  .base-topo { filter: saturate(.35) brightness(1.06) contrast(.9); }
  #note { position: absolute; left: 50%; transform: translateX(-50%); top: 60px; z-index: 1000; background: rgba(17,17,17,.88); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 15px; display: none; max-width: 88vw; text-align: center; }
  /* Local America look: black panels, tan text, gold trails */
  .key { position: absolute; left: 10px; right: 76px; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 1000; max-width: 420px; background: rgba(17,17,17,.86); color: var(--tan); border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.35); padding: 8px 12px; font-size: 13px; display: flex; gap: 6px 14px; flex-wrap: wrap; pointer-events: none; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .key span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .key i { display: inline-block; width: 22px; height: 6px; background: var(--gold); border: 2px solid #111; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255,255,255,.45); }
  .key i.dirt { height: 3px; background: var(--tan); border-width: 1px; box-shadow: none; }
  .key i.land { width: 16px; height: 12px; background: rgba(74,222,128,.35); border: 2px solid #bbf7d0; border-radius: 3px; box-shadow: none; }
  .key i.hwy { height: 7px; background: #fff; border: 2px solid #111; box-shadow: none; }
  .key i.pin { width: 12px; height: 12px; border: 2px solid var(--tan); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #111; box-shadow: none; }
  .fab { position: absolute; right: 12px; z-index: 1000; width: 54px; height: 54px; border-radius: 16px; border: 1px solid rgba(245,230,200,.18); background: rgba(17,17,17,.88); box-shadow: 0 2px 10px rgba(0,0,0,.4); font-size: 11px; font-weight: 600; color: var(--tan); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 0; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .fab svg { width: 24px; height: 24px; }
  .fab:active { transform: scale(.95); }
  #me-btn { bottom: calc(26px + env(safe-area-inset-bottom)); color: #60a5fa; }
  #sat-btn { bottom: calc(92px + env(safe-area-inset-bottom)); }
  #topo-btn { bottom: calc(158px + env(safe-area-inset-bottom)); }
  #topo-btn[aria-pressed="false"] { color: #a8a29e; }
  /* Place names drawn by us over the satellite photo */
  .lbl { color: #fff; font-weight: 600; white-space: nowrap; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 1px 2px #000; pointer-events: none; transform: translate(-50%, -50%); position: absolute; text-align: center; line-height: 1.15; }
  .lbl.peak { font-size: 12px; }
  .lbl.peak b { display: block; width: 0; height: 0; margin: 0 auto 2px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 9px solid #fff; filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000); }
  .lbl.peak small { display: block; font-size: 11px; font-weight: 500; }
  .lbl.valley { font-size: 12px; font-style: italic; font-weight: 500; color: #f5f5f4; }
  .lbl.town { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
  .lbl.road { font-size: 11px; font-weight: 700; color: var(--tan); background: rgba(17,17,17,.85); border: 1px solid rgba(245,230,200,.35); border-radius: 6px; padding: 1px 6px; text-shadow: none; }
  .lbl.shield { font-size: 12px; font-weight: 800; color: #111; background: #fff; border: 2px solid #111; border-radius: 6px; padding: 1px 6px; text-shadow: none; box-shadow: 0 1px 3px rgba(0,0,0,.6); letter-spacing: .01em; }
  .lbl.shield.us { border-radius: 6px 6px 12px 12px; }
  /* Brighten the brown topo lines so they show on the dark satellite photo */
  .contours { filter: brightness(1.7) saturate(.8); opacity: .7; }
  .me-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(37,99,235,.35), 0 1px 4px rgba(0,0,0,.4); box-sizing: border-box; position: relative; }
  .me-dot::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; background: rgba(37,99,235,.25); animation: pulse 2s ease-out infinite; z-index: -1; }
  @keyframes pulse { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .pin { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #111; border: 3px solid var(--tan); box-shadow: 0 2px 6px rgba(0,0,0,.55); box-sizing: border-box; display: grid; place-items: center; }
  .pin::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--tan); }
  .leaflet-popup-content-wrapper { border-radius: 14px; }
  .pop { font-size: 15px; }
  .pop h3 { margin: 0 0 4px; font-size: 17px; }
  .pop .big { font-weight: 600; }
  .pop .closed { color: #b91c1c; font-weight: 600; }
  .pop .small { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .pop a.btn { display: inline-block; margin-top: 8px; background: #15803d; color: #fff; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  body.locked #map, body.locked .fab, body.locked .key { display: none; }
  #gate { display: none; max-width: 420px; margin: 32px auto; padding: 0 16px; text-align: center; }
  body.locked #gate { display: block; }
  #gate h2 { font-size: 20px; margin: 0 0 8px; }
  #gate p { color: var(--muted); margin: 0 0 16px; }
  #gate .err { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; font-size: 14px; }
  #gate a.go { display: block; background: #15803d; color: #fff; padding: 12px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; }
  .leaflet-control-attribution { white-space: nowrap; overflow-x: auto; max-width: 100vw; font-size: 10px; background: rgba(17,17,17,.6) !important; color: #d6d3d1; }
  .leaflet-control-attribution a { color: var(--tan); }
  .leaflet-control-zoom { display: none; }
  @media (min-width: 700px) { .leaflet-control-zoom { display: block; } }
</style>
</head>
<body class="locked">
<header>
  <h1>Trails near you</h1>
  <a href="/">Back to Local America</a>
</header>
<div id="gate"><h2 id="gate-title">Checking your sign-in…</h2><p id="gate-text"></p><div id="gate-extra"></div></div>
<div id="note"></div>
<div id="map"></div>
<button class="fab" id="topo-btn" type="button" aria-label="Hide topo lines" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17c3-4 6-4 9-1s6 2 9-2"/><path d="M3 12c3-4 6-4 9-1s6 2 9-2"/><path d="M3 7c3-4 6-4 9-1s6 2 9-2"/></svg><span>Topo on</span></button>
<button class="fab" id="sat-btn" type="button" aria-label="Switch to the plain map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg><span>Map</span></button>
<button class="fab" id="me-btn" type="button" aria-label="Show where I am">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
</button>
<div class="key"><span><i class="hwy"></i>Highway</span><span><i></i>Open to drive</span><span><i class="dirt"></i>Dirt road, not checked</span><span><i class="land"></i>Public land</span><span><i class="pin"></i>Local America place</span></div>
<script>
// ---------- Owner only ----------
// Same sign-in as the Traffic page. The map starts only after Supabase confirms this is the owner account.
const sb = supabase.createClient('https://ycdlxdijrlfsxvxksyrq.supabase.co', 'sb_publishable_2ExdXbNtW9HpuOGAq1Oa7g_gPdONH_s', {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce', storageKey: 'la-traffic-auth' }
});
function gate(title, text, extra) {
  document.getElementById('gate-title').textContent = title;
  document.getElementById('gate-text').textContent = text || '';
  document.getElementById('gate-extra').innerHTML = extra || '';
}
const SIGN_IN = '<a class="go" href="/traffic.html">Go to the Traffic page to sign in</a>';
document.body.classList.remove('locked'); startMap();

function startMap() {
// Owner-only trails map (only the Local America owner account can open it; not linked from the app).
// - starts where you are (blue dot), or Willow Springs if location is off
// - satellite photo underneath (USGS, public domain); the Map button switches to the plain topo map
// - green = public land (Forest Service land from PAD-US)
// - cream lines with dark edges = Forest Service roads and trails open to vehicles today
// - thin tan lines = OpenStreetMap dirt and gravel roads (nobody has checked who may drive them)
// - pins = free Local America places (paid places have no public GPS)
const SUPABASE_URL = 'https://ycdlxdijrlfsxvxksyrq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2ExdXbNtW9HpuOGAq1Oa7g_gPdONH_s';
const WILLOW_SPRINGS = [36.9923, -91.9690];
const MISSOURI = L.latLngBounds([35.99, -95.77], [40.62, -89.10]);

const map = L.map('map', { zoomControl: true, preferCanvas: true, tap: true, maxZoom: 19 }).setView(WILLOW_SPRINGS, 12);
const renderer = L.canvas({ tolerance: 12 });

const topo = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {
  maxNativeZoom: 16, maxZoom: 19, className: 'base-topo', attribution: 'Base map: USGS The National Map'
});
const imagery = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}', {
  maxNativeZoom: 16, maxZoom: 19, zIndex: 1, attribution: 'Base map: USGS The National Map'
}).addTo(map);

// Close up, the cached satellite above gets blurry (it stops at about 2.4 m per pixel).
// From zoom 14 the full-detail aerial photos (USDA NAIP, about 0.6 m per pixel) are drawn on top, straight from USGS.
// Topo lines: USGS elevation contours (brown lines with heights), drawn over the satellite from zoom 11.
const MERC = 20037508.342789244;
const ArcExport = L.TileLayer.extend({
  getTileUrl(c) {
    const size = (2 * MERC) / Math.pow(2, c.z);
    const bbox = [-MERC + c.x * size, MERC - (c.y + 1) * size, -MERC + (c.x + 1) * size, MERC - c.y * size].join(',');
    return this._base + '&bbox=' + bbox;
  }
});
const sharp = new ArcExport('', { minZoom: 14, maxNativeZoom: 18, maxZoom: 19, zIndex: 2, tileSize: 256 });
sharp._base = 'https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer/exportImage?f=image&format=jpg&bboxSR=3857&imageSR=3857&size=512,512&renderingRule=' + encodeURIComponent('{"rasterFunction":"NaturalColor"}');
sharp.addTo(map);
const contours = new ArcExport('', { minZoom: 11, maxZoom: 19, zIndex: 5, className: 'contours' });
contours._base = 'https://carto.nationalmap.gov/arcgis/rest/services/contours/MapServer/export?f=image&format=png32&transparent=true&bboxSR=3857&imageSR=3857&size=512,512&dpi=144';
// Zoomed out: only the bold every-5th lines with heights. Close up (16+): every line.
contours.getTileUrl = function (c) {
  const show = c.z >= 16 ? '2,10,11,15,16,21,22,25,26' : '2,10,11,15,16,21,25';
  return ArcExport.prototype.getTileUrl.call(this, c) + '&layers=show:' + show;
};
contours.addTo(map);
map.attributionControl.addAttribution('Aerial photos: USDA NAIP; Topo lines: USGS 3DEP');
map.attributionControl.setPrefix('');
map.attributionControl.addAttribution('Roads: Forest Service; Public land: USGS PAD-US; © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors');

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let noteTimer;
const note = (msg, ms) => {
  const n = document.getElementById('note'); clearTimeout(noteTimer);
  n.textContent = msg || ''; n.style.display = msg ? 'block' : 'none';
  if (msg && ms) noteTimer = setTimeout(() => note(''), ms);
};
const titleCase = (t) => String(t).toLowerCase().replace(/\b([a-z])/g, (m) => m.toUpperCase()).replace(/'S\b/g, "'s");
const miles = (m) => (m < 0.1 ? 'under 0.1' : m < 10 ? m.toFixed(1) : Math.round(m)) + ' mi';

// ---------- Where am I ----------
let me = null, meMarker = null, followed = false;
const meIcon = L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [20, 20], iconAnchor: [10, 10] });
function showMe(ll) {
  me = L.latLng(ll);
  if (!meMarker) meMarker = L.marker(me, { icon: meIcon, interactive: false, zIndexOffset: 1000 }).addTo(map);
  else meMarker.setLatLng(me);
}
function startLocation(centerOnIt) {
  if (!navigator.geolocation) { fallback("This phone isn't sharing its location, so here's Willow Springs."); return; }
  if (centerOnIt) note('Finding you…');
  navigator.geolocation.watchPosition((p) => {
    showMe([p.coords.latitude, p.coords.longitude]);
    if (!followed || centerOnIt) {
      followed = true; centerOnIt = false;
      if (MISSOURI.contains(me)) { map.setView(me, 14); note(''); }
      else fallback("You're outside Missouri, where this map has trails. Here's Willow Springs.");
    }
  }, () => { if (!followed) { followed = true; fallback('Location is off, so here is Willow Springs. Tap the blue button to try again.'); } },
  { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
}
function fallback(msg) { map.setView(WILLOW_SPRINGS, 12); note(msg, 6000); }
document.getElementById('me-btn').onclick = () => {
  if (me) { map.setView(me, Math.max(map.getZoom(), 14)); return; }
  followed = false; startLocation(true);
};
let sat = true;
let topoOn = true;
document.getElementById('topo-btn').onclick = (e) => {
  topoOn = !topoOn;
  if (topoOn) contours.addTo(map); else map.removeLayer(contours);
  e.currentTarget.querySelector('span').textContent = topoOn ? 'Topo on' : 'Topo off';
  e.currentTarget.setAttribute('aria-pressed', String(topoOn));
  e.currentTarget.ariaLabel = topoOn ? 'Hide topo lines' : 'Show topo lines';
};
document.getElementById('sat-btn').onclick = (e) => {
  sat = !sat;
  if (sat) { map.removeLayer(topo); imagery.addTo(map); sharp.addTo(map); if (topoOn) contours.addTo(map); e.currentTarget.querySelector('span').textContent = 'Map'; e.currentTarget.ariaLabel = 'Switch to the plain map'; }
  else { map.removeLayer(imagery); map.removeLayer(sharp); map.removeLayer(contours); topo.addTo(map); e.currentTarget.querySelector('span').textContent = 'Satellite'; e.currentTarget.ariaLabel = 'Switch to satellite'; }
  document.getElementById('topo-btn').style.display = sat ? '' : 'none';
};

// ---------- Places (pins) ----------
const placeList = [];
const pinIcon = L.divIcon({ className: '', html: '<div class="pin"></div>', iconSize: [30, 30], iconAnchor: [4, 30], popupAnchor: [11, -28] });
fetch(`${SUPABASE_URL}/rest/v1/poi_public_locations?select=id,name,category,latitude,longitude`, {
  headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
}).then((r) => r.json()).then((rows) => {
  (rows || []).filter((l) => l.latitude != null && l.longitude != null).forEach((l) => {
    const ll = L.latLng(l.latitude, l.longitude);
    placeList.push({ name: l.name, ll });
    L.marker(ll, { icon: pinIcon, zIndexOffset: 500 }).bindPopup(() => {
      const away = me ? `<div>${miles(me.distanceTo(ll) / 1609.34)} from you</div>` : '';
      return `<div class="pop"><h3>${esc(l.name)}</h3><div>${esc(l.category || '')}</div>${away}<a class="btn" href="/#/p/${encodeURIComponent(l.id)}">Open in Local America</a></div>`;
    }).addTo(map);
  });
}).catch(() => {});

// Closest place to a line, and how far
function nearestPlace(latlngs) {
  const pts = latlngs.flat(3);
  const step = Math.max(1, Math.floor(pts.length / 40));
  let best = null;
  for (const p of placeList) {
    for (let i = 0; i < pts.length; i += step) {
      const d = p.ll.distanceTo(pts[i]);
      if (!best || d < best.d) best = { name: p.name, d };
    }
  }
  return best && best.d < 16000 ? best : null; // within about 10 miles
}
function lineMiles(latlngs) {
  let m = 0;
  (Array.isArray(latlngs[0]) ? latlngs : [latlngs]).forEach((seg) => { for (let i = 1; i < seg.length; i++) m += L.latLng(seg[i - 1]).distanceTo(seg[i]); });
  return m / 1609.34;
}
function placeAndYou(latlngs) {
  let out = '';
  const near = nearestPlace(latlngs);
  if (near) out += `<div>Leads toward <b>${esc(near.name)}</b>${near.d > 400 ? ' (' + miles(near.d / 1609.34) + ' away)' : ''}</div>`;
  if (me) {
    const pts = latlngs.flat(3); let d = Infinity;
    pts.forEach((p) => { d = Math.min(d, me.distanceTo(p)); });
    out += `<div>${d < 150 ? "You're on it" : miles(d / 1609.34) + ' from you'}</div>`;
  }
  return out;
}

// ---------- Public land (green) ----------
// Drawn first on the same canvas as the roads, so roads sit on top and win a tap when you're close
// to one; a tap anywhere else inside the green says what land it is.
function landPopup(a) {
  const name = a.n ? `${a.k}: ${a.n}` : a.k;
  const access = a.o ? 'Open to the public.' : 'Open to the public with some limits. Check the rules before you go.';
  return `<div class="pop"><h3>${esc(name)}</h3><div>${access}</div>${me ? `<div>${miles(nearestOnLand(a.ll) / 1609.34)} from you</div>` : ''}
    <div class="small">Public land from USGS PAD-US and the Forest Service. Driving is only allowed on roads marked open.</div></div>`;
}
function nearestOnLand(rings) {
  let best = Infinity;
  for (const ring of rings) for (const p of ring) best = Math.min(best, me.distanceTo(p));
  return best;
}
function drawLand(j) {
  (j.areas || []).forEach((a) => {
    a.ll = a.r.map((ring) => ring.map(([x, y]) => L.latLng(y, x)));
    L.polygon(a.ll, { renderer, color: '#bbf7d0', weight: 2, opacity: 0.85, fillColor: '#4ade80', fillOpacity: 0.16 })
      .bindPopup(() => landPopup(a)).addTo(landLayer);
  });
}
const landLayer = L.layerGroup().addTo(map);

// ---------- Forest Service roads and trails open to vehicles ----------
const fsLayer = L.layerGroup().addTo(map);
const isOpen = (v) => v != null && String(v).trim() !== '' && !/^(n|no|null)$/i.test(String(v).trim());
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
// Dates look like "04/01-12/15" (sometimes several, split by commas)
function ranges(s) {
  return String(s || '').split(/[,;]/).map((r) => r.trim().match(/^(\d{1,2})\/(\d{1,2})\s*-\s*(\d{1,2})\/(\d{1,2})$/)).filter(Boolean)
    .map((m) => ({ a: +m[1] * 100 + +m[2], b: +m[3] * 100 + +m[4], text: `${MONTHS[+m[1] - 1]} ${+m[2]} to ${MONTHS[+m[3] - 1]} ${+m[4]}` }));
}
function openToday(rs) {
  if (!rs.length) return true;
  const t = new Date(), today = (t.getMonth() + 1) * 100 + t.getDate();
  return rs.some(({ a, b }) => (a <= b ? today >= a && today <= b : today >= a || today <= b));
}
function fsInfo(a) {
  const jeep = isOpen(a.highclearancevehicle) || isOpen(a.fourwd_gt50inches);
  const car = isOpen(a.passengervehicle);
  const atv = isOpen(a.atv) || isOpen(a.otherwheeled_ohv);
  const moto = isOpen(a.motorcycle);
  if (!jeep && !car && !atv && !moto) return null;
  const dateField = car ? a.passengervehicle_datesopen : jeep ? (a.highclearancevehicle_datesopen || a.fourwd_gt50_datesopen) : atv ? (a.atv_datesopen || a.otherwheeled_ohv_datesopen) : a.motorcycle_datesopen;
  const rs = ranges(dateField).filter((r) => !(r.a === 101 && r.b === 1231));
  const label = car ? 'Any car' : jeep ? 'Jeep friendly' : atv ? 'ATV and side-by-side only' : 'Dirt bikes only';
  const extra = (car || jeep) && atv ? ', ATVs too' : '';
  return { label: label + extra, rough: /^\s*[12]\b/.test(String(a.operationalmaintlevel || '')), rs, open: openToday(rs) };
}
function fsPopup(a, info, latlngs, isTrail) {
  const num = a.id ? (isTrail ? 'Trail ' : 'Forest Road ') + a.id : '';
  const name = a.name && a.name.trim() ? titleCase(a.name) : (num || 'Forest Service road');
  const len = a.gis_miles != null ? Number(a.gis_miles) : lineMiles(latlngs);
  const season = !info.open ? `<div class="closed">Closed right now. Open ${esc(info.rs.map((r) => r.text).join(', '))}</div>`
    : info.rs.length ? `<div>Open ${esc(info.rs.map((r) => r.text).join(', '))}</div>` : '';
  return `<div class="pop"><h3>${esc(name)}</h3><div class="big">${esc(info.label)} · ${miles(len).replace(' mi', ' miles')}</div>${season}${info.rough && info.label === 'Any car' ? '<div>Rough in spots</div>' : ''}${placeAndYou(latlngs)}
    <div class="small">${esc(num && name !== num ? num + ' · ' : '')}From the Forest Service. Open means allowed, not that it's in good shape today.</div></div>`;
}
// Forest Service roads come from our own site (a saved copy), not live from the Forest Service.
// Dirt roads draw first and Forest Service roads on top, all on one canvas so taps work everywhere.
const DIRT_KINDS = { 'Dirt track': 'Dirt track', 'Dirt road': 'Dirt road', 'Unpaved road': 'Gravel or dirt road', 'Gravel road': 'Gravel road' };
const getJson = (url, tries = 3) => fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .catch((e) => (tries > 1 ? new Promise((ok) => setTimeout(ok, 1500)).then(() => getJson(url, tries - 1)) : Promise.reject(e)));
// Map data files live on Cloudflare R2 (bucket localamerica-trails), apart from the app videos
const DATA = 'https://pub-2db698c77b2e4668a900baa59fbc0af0.r2.dev/';
// ---------- Dirt and gravel roads (OpenStreetMap), all of Missouri ----------
// One file holds the whole state cut into small pieces by area (0.25 degree squares). The map
// reads only the pieces on screen, a few KB each, so the phone never downloads the whole state.
const DIRT_FILES = [DATA + 'dirt-roads-mo.bin'];
const DIRT_MIN_ZOOM = 10;
let dirtSrc = null, dirtWhole = null, dirtIdx = null, dirtStart = 0, dirtIdxP = null, dirtFailed = false;
const dirtAsked = new Set(), dirtShown = new Set();
async function getRange(url, from, to) {
  if (dirtWhole && url === dirtSrc) return dirtWhole.slice(from, to + 1);
  const r = await fetch(url, { headers: { Range: `bytes=${from}-${to}` } });
  if (!r.ok) throw new Error(r.status);
  const b = new Uint8Array(await r.arrayBuffer());
  if (r.status === 206) return b;
  dirtWhole = b; // server sent the whole file instead of a piece; keep it and cut pieces from it
  return b.slice(from, to + 1);
}
async function dirtIndex() {
  for (const url of DIRT_FILES) {
    try {
      dirtSrc = url; dirtWhole = null;
      let head = await getRange(url, 0, 65535);
      const len = +new TextDecoder().decode(head.slice(0, 10));
      if (!len) throw new Error('bad file');
      if (10 + len > head.length) head = await getRange(url, 0, 9 + len);
      dirtIdx = JSON.parse(new TextDecoder().decode(head.slice(10, 10 + len)));
      dirtStart = 10 + len;
      if (new URLSearchParams(location.search).has('debug')) note('Dirt roads from ' + (url.startsWith('http') ? 'R2' : 'this site'), 8000);
      return;
    } catch (e) { /* try the next copy */ }
  }
  throw new Error('dirt roads unavailable');
}
async function gunzipJson(bytes) {
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(s).text());
}
function drawDirt(fc) {
  // dark edge first so the thin tan line shows on the satellite photo
  L.geoJSON(fc, { interactive: false, style: () => ({ renderer, color: '#111', weight: 5, opacity: 0.5, lineCap: 'round', lineJoin: 'round' }) }).addTo(map);
  L.geoJSON(fc, {
    style: () => ({ renderer, color: '#f5e6c8', weight: 2.5, opacity: 0.95, lineCap: 'round', lineJoin: 'round' }),
    onEachFeature: (f, layer) => {
      const p = f.properties;
      layer.bindPopup(() => `<div class="pop"><h3>${esc(p.n || DIRT_KINDS[p.k])}</h3><div class="big">${esc(DIRT_KINDS[p.k])} · ${miles(Number(p.mi)).replace(' mi', ' miles')}</div>${placeAndYou(layer.getLatLngs())}
        <div class="small">Nobody has checked who may drive this one. Some are private land. Map data © OpenStreetMap contributors.</div></div>`);
    }
  }).addTo(map);
  // keep the highways, then the Forest Service roads, drawn on top
  if (map.hasLayer(mainLayer)) { mainLayer.remove(); mainLayer.addTo(map); }
  if (map.hasLayer(fsLayer)) { fsLayer.remove(); fsLayer.addTo(map); }
}
async function loadDirt() {
  if (dirtFailed || map.getZoom() < DIRT_MIN_ZOOM) return;
  try { await (dirtIdxP = dirtIdxP || dirtIndex()); }
  catch (e) { dirtFailed = true; note("Couldn't load the dirt roads. Pull down to reload the page.", 6000); return; }
  const C = dirtIdx.cell, b = map.getBounds().pad(0.2), keys = [];
  for (let i = Math.floor(b.getWest() / C); i <= Math.floor(b.getEast() / C); i++) {
    for (let j = Math.floor(b.getSouth() / C); j <= Math.floor(b.getNorth() / C); j++) {
      const k = i + '_' + j;
      if (dirtIdx.tiles[k] && !dirtAsked.has(k)) { dirtAsked.add(k); keys.push(k); }
    }
  }
  if (!keys.length) return;
  const rows = (await Promise.all(keys.map(async (k) => {
    const [off, len] = dirtIdx.tiles[k];
    try { return await gunzipJson(await getRange(dirtSrc, dirtStart + off, dirtStart + off + len - 1)); }
    catch (e) { dirtAsked.delete(k); return []; }
  }))).flat();
  const features = [];
  for (const [k, mi, n, coords, id] of rows) {
    if (dirtShown.has(id) || !DIRT_KINDS[k]) continue;
    dirtShown.add(id);
    features.push({ type: 'Feature', properties: { k, mi, n }, geometry: { type: typeof coords[0][0] === 'number' ? 'LineString' : 'MultiLineString', coordinates: coords } });
  }
  if (features.length) drawDirt({ type: 'FeatureCollection', features });
}

Promise.allSettled([getJson(DATA + 'fs-roads.json'), getJson(DATA + 'public-land.json')]).then(([fs, land]) => {
  if (land.status === 'fulfilled') { drawLand(land.value); [mainLayer, fsLayer].forEach((g) => { if (map.hasLayer(g)) { g.remove(); g.addTo(map); } }); }
  else note("Couldn't load the public land. Pull down to reload the page.", 6000);
  // dirt roads start after the land so they draw above it, and load more as the map moves
  loadDirt();
  map.on('moveend', loadDirt);
  if (fs.status !== 'fulfilled') { note("Couldn't load the Forest Service roads. Pull down to reload the page.", 8000); return; }
  (fs.value.features || []).forEach((f) => {
    const a = f.a || {};
    const info = fsInfo(a);
    if (!info) return;
    const ll = f.p.map((path) => path.map(([x, y]) => L.latLng(y, x)));
    const round = { lineCap: 'round', lineJoin: 'round' };
    if (info.open) L.polyline(ll, { renderer, color: '#fff', weight: 13, opacity: 0.22, interactive: false, ...round }).addTo(fsLayer);
    L.polyline(ll, { renderer, color: '#111', weight: info.open ? 9 : 5, opacity: info.open ? 0.95 : 0.6, interactive: false, ...round }).addTo(fsLayer);
    L.polyline(ll, { renderer, color: info.open ? '#f2b134' : '#a8a29e', weight: info.open ? 4.5 : 2.5, opacity: 1, dashArray: info.open ? null : '6 6', ...round })
      .bindPopup(() => fsPopup(a, info, ll, f.t === 2)).addTo(fsLayer);
    const p0 = ll[0] || [];
    if (info.open && p0.length) roadLabels.push({ ll: p0[Math.floor(p0.length / 2)], text: fsLabel(a, f.t === 2) });
  });
  drawLabels();
});

// ---------- Highways and main paved roads ----------
// Interstates, US highways and Missouri state routes (numbered and lettered, like Hwy 76 or Rte CC) from the
// USGS road map, fetched for the area on screen. Drawn white with a dark edge so they stand apart from the
// gold Forest Service roads and the thin tan dirt roads.
const ROADS = 'https://carto.nationalmap.gov/arcgis/rest/services/transportation/MapServer/';
const roadCache = new Map();
const mainLayer = L.layerGroup().addTo(map);
let mainLabels = [], mainRun = 0, mainDrawn = '';
function mainQuery(layer, b, z) {
  // snap the box out to a grid so small pans reuse the same download
  const step = z < 10 ? 0.5 : z < 12 ? 0.25 : 0.1, dn = (v) => Math.floor(v / step) * step, up = (v) => Math.ceil(v / step) * step;
  const g = [dn(b.getWest()), dn(b.getSouth()), up(b.getEast()), up(b.getNorth())].map((v) => v.toFixed(2)).join(',');
  const key = layer + '|' + z + '|' + g;
  if (roadCache.has(key)) return roadCache.get(key);
  const off = (360 / (256 * 2 ** z)) * 1.5; // simplify to about a pixel and a half
  const url = `${ROADS}${layer}/query?f=json&where=1%3D1&geometry=${g}&geometryType=esriGeometryEnvelope&inSR=4326&outSR=4326&spatialRel=esriSpatialRelIntersects&outFields=name,interstate,us_route,state_route&returnGeometry=true&maxAllowableOffset=${off.toFixed(6)}&geometryPrecision=5&resultRecordCount=2000`;
  const p = fetch(url).then((r) => r.json()).then((j) => { if (j.error) throw new Error('roads'); return j.features || []; }).catch(() => { roadCache.delete(key); return []; });
  roadCache.set(key, p);
  if (roadCache.size > 40) roadCache.delete(roadCache.keys().next().value);
  return p;
}
// "US 60", "I-44", "Hwy 76", "Rte CC" from the route fields
function shieldOf(a) {
  const first = (v) => String(v || '').split(',').map((x) => x.trim().replace(/^(I-|I |US |MO |SR )/i, '')).find((x) => x && !/^(bus|byp|alt|spur|loop)$/i.test(x)) || '';
  const i = first(a.interstate), u = first(a.us_route), s = first(a.state_route);
  if (i) return { text: 'I-' + i, cls: 'us', rank: 3 };
  if (u) return { text: 'US ' + u, cls: 'us', rank: 2 };
  if (s) return { text: (/^\d+$/.test(s) ? 'Hwy ' : 'Rte ') + s, cls: '', rank: 1 };
  return null;
}
async function drawMain() {
  const run = ++mainRun, z = map.getZoom();
  if (z < 8) { mainLayer.clearLayers(); mainLabels = []; mainDrawn = ''; return; }
  const b = map.getBounds().pad(0.15);
  const layers = [29, 30].concat(z >= 10 ? [31] : []);
  // same downloads as what is already drawn: nothing to redraw
  const sig = layers.map((l) => mainQuery(l, b, z)), sigKey = z + '|' + [...roadCache.keys()].filter((k) => sig.includes(roadCache.get(k))).join(';');
  if (sigKey === mainDrawn) return;
  // draw each kind of road as soon as it arrives (the state routes can take a few seconds)
  const sets = layers.map(() => null);
  await Promise.all(sig.map((p, i) => p.then((fs) => {
    sets[i] = fs;
    if (run !== mainRun) return;
    try { renderMain([].concat(...sets.filter(Boolean)), z); } catch (e) { return; }
    if (sets.every(Boolean)) mainDrawn = sigKey; else drawLabels();
  })));
}
function renderMain(feats, z) {
  const big = z >= 12, round = { lineCap: 'round', lineJoin: 'round' };
  mainLayer.clearLayers();
  const labels = [];
  // all dark edges first, then the white cores, so crossings look clean
  const lines = feats.map((f) => {
    const sh = shieldOf(f.attributes || {});
    const ll = ((f.geometry && f.geometry.paths) || []).map((path) => path.map(([x, y]) => [y, x])).filter((p) => p.length > 1);
    return { f, sh, ll, w: (sh && sh.rank >= 2 ? 1.4 : 1) * (big ? 5 : 3.5) };
  }).filter((x) => x.ll.length);
  lines.forEach((x) => L.polyline(x.ll, { renderer, color: '#111', weight: x.w + 4, opacity: 0.9, interactive: false, ...round }).addTo(mainLayer));
  lines.forEach((x) => {
    const name = (x.f.attributes && x.f.attributes.name) || (x.sh && x.sh.text) || 'Highway';
    L.polyline(x.ll, { renderer, color: '#ffffff', weight: x.w, opacity: 1, ...round })
      .bindPopup(() => `<div class="pop"><h3>${esc(name)}</h3><div class="big">Paved highway${x.sh ? ' · ' + esc(x.sh.text) : ''}</div><div class="small">Road map: USGS The National Map.</div></div>`)
      .addTo(mainLayer);
    if (x.sh) labels.push({ text: x.sh.text, cls: x.sh.cls, rank: x.sh.rank, ll: x.ll });
  });
  mainLabels = labels;
  if (map.hasLayer(fsLayer)) { fsLayer.remove(); fsLayer.addTo(map); }
}

// ---------- Names on the map ----------
// Peaks (with height), hollows and towns come from the USGS place-name list (GNIS), fetched for the area on screen.
// Forest road numbers come from our own Forest Service file. Labels that would overlap are skipped.
const roadLabels = [];
function fsLabel(a, isTrail) {
  const num = a.id ? (isTrail ? 'Trail ' : 'FS ') + a.id : '';
  const name = a.name && a.name.trim() ? titleCase(a.name) : '';
  return name && num && !name.includes(a.id) ? `${name} · ${num}` : (name || num);
}
const GNIS = 'https://carto.nationalmap.gov/arcgis/rest/services/geonames/MapServer/';
const nameCache = new Map(), heightCache = new Map();
const labelLayer = L.layerGroup().addTo(map);
async function gnis(layer, where, b) {
  const g = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map((v) => v.toFixed(3)).join(',');
  const key = layer + '|' + g;
  if (nameCache.has(key)) return nameCache.get(key);
  const url = `${GNIS}${layer}/query?f=json&where=${encodeURIComponent(where)}&geometry=${g}&geometryType=esriGeometryEnvelope&inSR=4326&outSR=4326&outFields=gaz_name,gaz_featureclass&returnGeometry=true&resultRecordCount=300`;
  const p = fetch(url).then((r) => r.json()).then((j) => { if (j.error) throw new Error('gnis'); return j.features || []; }).catch(() => { nameCache.delete(key); return []; });
  nameCache.set(key, p);
  if (nameCache.size > 60) nameCache.delete(nameCache.keys().next().value);
  return p;
}
function peakHeight(ll) {
  const key = ll.lat.toFixed(5) + ',' + ll.lng.toFixed(5);
  if (!heightCache.has(key)) {
    heightCache.set(key, fetch(`https://epqs.nationalmap.gov/v1/json?x=${ll.lng}&y=${ll.lat}&units=Feet&wkid=4326`)
      .then((r) => r.json()).then((j) => (Number(j.value) > 0 ? Math.round(j.value) : null)).catch(() => null));
  }
  return heightCache.get(key);
}
let labelRun = 0;
async function drawLabels() {
  const run = ++labelRun, z = map.getZoom();
  if (z < 8) { labelLayer.clearLayers(); return; }
  const b = map.getBounds();
  const [lands, towns] = await Promise.all([
    z >= 12 ? gnis(5, "gaz_featureclass IN ('Summit','Valley','Ridge','Gap')", b) : [],
    z >= 11 ? gnis(1, '1=1', b).then((a) => (z >= 12 ? gnis(3, '1=1', b).then((c) => a.concat(c)) : a)) : []
  ]);
  if (run !== labelRun) return;
  const items = [];
  // highway shields: one per route, halfway along the part that is on screen (kept off the edges)
  const inner = b.pad(-0.1);
  mainLabels.forEach((m) => {
    const on = [];
    m.ll.forEach((path) => path.forEach((pt, i) => {
      if (i) { const half = [(pt[0] + path[i - 1][0]) / 2, (pt[1] + path[i - 1][1]) / 2]; if (inner.contains(half)) on.push(half); }
      if (inner.contains(pt)) on.push(pt);
    }));
    if (on.length) items.push({ kind: 'shield' + (m.cls ? ' ' + m.cls : ''), name: m.text, ll: L.latLng(on[Math.floor(on.length / 2)]), pri: 2.7 + m.rank / 10 + on.length / 1e6 });
  });
  const ptsOf = (f) => (f.geometry && (f.geometry.points || (f.geometry.x != null ? [[f.geometry.x, f.geometry.y]] : null))) || [];
  towns.forEach((f) => { if (!f.attributes.gaz_name || !ptsOf(f).length) return; const pt = ptsOf(f)[0]; items.push({ kind: 'town', name: f.attributes.gaz_name, ll: L.latLng(pt[1], pt[0]), pri: 3 }); });
  if (z >= 13) roadLabels.forEach((r) => { if (b.contains(r.ll) && r.text) items.push({ kind: 'road', name: r.text, ll: r.ll, pri: 2 }); });
  lands.forEach((f) => {
    const pts = ptsOf(f), c = f.attributes.gaz_featureclass;
    if (!f.attributes.gaz_name || !pts.length) return;
    const pt = pts.length > 1 ? [(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2] : pts[0];
    if (c !== 'Summit' && z < 13) return;
    items.push({ kind: c === 'Summit' ? 'peak' : 'valley', name: f.attributes.gaz_name, ll: L.latLng(pt[1], pt[0]), pri: c === 'Summit' ? 2.5 : 0 });
  });
  items.sort((x, y) => y.pri - x.pri);
  const taken = [], seen = new Set(), out = [];
  for (const it of items) {
    const k = it.kind + it.name; if (seen.has(k)) continue;
    const p = map.latLngToContainerPoint(it.ll);
    const w = it.name.length * (it.kind === 'town' ? 8.5 : 7.5) + 16, h = it.kind === 'peak' ? 44 : it.kind.startsWith('shield') ? 24 : 22;
    const box = [p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2];
    if (taken.some((t) => box[0] < t[2] && box[2] > t[0] && box[1] < t[3] && box[3] > t[1])) continue;
    taken.push(box); seen.add(k); out.push(it);
    if (out.length >= 45) break;
  }
  labelLayer.clearLayers();
  out.forEach((it) => {
    const id = 'h' + Math.random().toString(36).slice(2);
    const inner = it.kind === 'peak' ? `<b></b>${esc(it.name)}<small id="${id}"></small>` : esc(it.name);
    L.marker(it.ll, { interactive: false, keyboard: false, zIndexOffset: -100,
      icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="lbl ${it.kind}">${inner}</div>` }) }).addTo(labelLayer);
    if (it.kind === 'peak') peakHeight(it.ll).then((ft) => { const el = document.getElementById(id); if (el && ft) el.textContent = ft.toLocaleString('en-US') + ' ft'; });
  });
}
let labelTimer;
map.on('moveend', () => { clearTimeout(labelTimer); labelTimer = setTimeout(() => drawMain().finally(drawLabels), 250); });
setTimeout(() => drawMain().finally(drawLabels), 400);
map.attributionControl.addAttribution('Names and heights: USGS GNIS, 3DEP; Highways: USGS');

// ---------- Start ----------
// For checking the page: ?at=lat,lng skips location; ?open=fs or ?open=dirt opens one line's info box
const qs = new URLSearchParams(location.search);
const at = qs.get('at');
const atLL = at ? at.split(',').map(Number) : [];
if (atLL.length === 2 && atLL.every(Number.isFinite)) { showMe(atLL); followed = true; map.setView(me, 14); }
else startLocation(false);
const openParam = qs.get('open');
let tries = 0;
function demoOpen() {
  let first;
  const take = (l) => { if (!first && l.getPopup && l.getPopup()) first = l; };
  if (openParam === 'fs') fsLayer.eachLayer(take); else if (openParam === 'land') landLayer.eachLayer((l) => { if (!first && /Conservation area: Peck/.test(l.getPopup()._content() || '')) first = l; }); else map.eachLayer((l) => { if (l.feature) take(l); });
  if (!first) { if (++tries < 30) setTimeout(demoOpen, 1000); return; }
  const ll = first.getLatLngs().flat(3); first.openPopup(ll[Math.floor(ll.length / 2)]);
}
if (openParam) setTimeout(demoOpen, 1500);
}
</script>
