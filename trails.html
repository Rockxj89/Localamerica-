<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trails · Local America</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root { --tan: #f5e6c8; --gold: #f2b134; --ink: #1c1917; --muted: #57534e; --drive: #f5ecd7; --edge: #3b2f22; --dirt: #d9c7a3; --land: #22c55e; --me: #2563eb; --pin: #111827; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #faf7f2; display: flex; flex-direction: column; }
  header { padding: 10px 14px; background: #111; color: #f5e6c8; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header a { color: #f5e6c8; font-size: 14px; }
  #map { flex: 1; min-height: 0; }
  /* Fade the base map so the trails stand out */
  .base-topo { filter: saturate(.35) brightness(1.06) contrast(.9); }
  #note { position: absolute; left: 50%; transform: translateX(-50%); top: 60px; z-index: 1000; background: rgba(17,17,17,.88); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 15px; display: none; max-width: 88vw; text-align: center; }
  /* Local America look: black panels, tan text, gold trails */
  .key { position: absolute; left: 10px; right: 76px; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 1000; max-width: 420px; background: rgba(17,17,17,.86); color: var(--tan); border-radius: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.35); padding: 8px 12px; font-size: 13px; display: flex; gap: 6px 14px; flex-wrap: wrap; pointer-events: none; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .key span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .key i { display: inline-block; width: 22px; height: 6px; background: var(--gold); border: 2px solid #111; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255,255,255,.45); }
  .key i.dirt { height: 3px; background: var(--tan); border-width: 1px; box-shadow: none; }
  .key i.land { width: 16px; height: 12px; background: rgba(74,222,128,.35); border: 2px solid #bbf7d0; border-radius: 3px; box-shadow: none; }
  .key i.hwy { height: 7px; background: #fff; border: 2px solid #111; box-shadow: none; }
  .key i.pin { width: 12px; height: 12px; border: 2px solid var(--tan); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #111; box-shadow: none; }
  .fab { position: absolute; right: 12px; z-index: 1000; width: 54px; height: 54px; border-radius: 16px; border: 1px solid rgba(245,230,200,.18); background: rgba(17,17,17,.88); box-shadow: 0 2px 10px rgba(0,0,0,.4); font-size: 11px; font-weight: 600; color: var(--tan); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 0; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .fab svg { width: 24px; height: 24px; }
  .fab:active { transform: scale(.95); }
  #me-btn { bottom: calc(26px + env(safe-area-inset-bottom)); color: #60a5fa; }
  #sat-btn { bottom: calc(92px + env(safe-area-inset-bottom)); }
  #topo-btn { bottom: calc(158px + env(safe-area-inset-bottom)); }
  #topo-btn[aria-pressed="false"] { color: #a8a29e; }
  /* Place names drawn by us over the satellite photo */
  .lbl { color: #fff; font-weight: 600; white-space: nowrap; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 1px 2px #000; pointer-events: none; transform: translate(-50%, -50%); position: absolute; text-align: center; line-height: 1.15; }
  .lbl.peak { font-size: 12px; }
  .lbl.peak b { display: block; width: 0; height: 0; margin: 0 auto 2px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 9px solid #fff; filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000); }
  .lbl.peak small { display: block; font-size: 11px; font-weight: 500; }
  .lbl.valley { font-size: 12px; font-style: italic; font-weight: 500; color: #f5f5f4; }
  .lbl.town { font-size: 14px; font-weight: 700; letter-spacing: .02em; }
  .lbl.road { font-size: 11px; font-weight: 700; color: var(--tan); background: rgba(17,17,17,.85); border: 1px solid rgba(245,230,200,.35); border-radius: 6px; padding: 1px 6px; text-shadow: none; }
  .lbl.shield { font-size: 12px; font-weight: 800; color: #111; background: #fff; border: 2px solid #111; border-radius: 6px; padding: 1px 6px; text-shadow: none; box-shadow: 0 1px 3px rgba(0,0,0,.6); letter-spacing: .01em; }
  .lbl.shield.us { border-radius: 6px 6px 12px 12px; }
  /* Brighten the brown topo lines so they show on the dark satellite photo */
  .contours { filter: brightness(1.7) saturate(.8); opacity: .7; }
  .me-dot { width: 20px; height: 20px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(37,99,235,.35), 0 1px 4px rgba(0,0,0,.4); box-sizing: border-box; position: relative; }
  .me-dot::after { content: ""; position: absolute; inset: -12px; border-radius: 50%; background: rgba(37,99,235,.25); animation: pulse 2s ease-out infinite; z-index: -1; }
  @keyframes pulse { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
  .pin { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #111; border: 3px solid var(--tan); box-shadow: 0 2px 6px rgba(0,0,0,.55); box-sizing: border-box; display: grid; place-items: center; }
  .pin::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--tan); }
  .leaflet-popup-content-wrapper { border-radius: 14px; }
  .pop { font-size: 15px; }
  .pop h3 { margin: 0 0 4px; font-size: 17px; }
  .pop .big { font-weight: 600; }
  .pop .closed { color: #b91c1c; font-weight: 600; }
  .pop .small { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .pop a.btn { display: inline-block; margin-top: 8px; background: #15803d; color: #fff; padding: 6px 12px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  #lay-btn { bottom: calc(224px + env(safe-area-inset-bottom)); }
  #lay-btn[aria-expanded="true"] { color: var(--gold); }
  /* Layers panel: slides up from the bottom */
  #panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1100; max-height: 72vh; overflow-y: auto; background: #111; color: var(--tan); border-radius: 18px 18px 0 0; box-shadow: 0 -4px 18px rgba(0,0,0,.5); padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .22s ease; -webkit-overflow-scrolling: touch; }
  #panel.open { transform: none; }
  #panel .grab { width: 40px; height: 5px; border-radius: 3px; background: #44403c; margin: 2px auto 8px; }
  #panel .top { display: flex; align-items: center; justify-content: space-between; }
  #panel h2 { margin: 0; font-size: 18px; color: #fff; }
  #panel .close { background: none; border: 0; color: var(--tan); font-size: 15px; font-weight: 600; padding: 8px 4px; cursor: pointer; }
  #panel h3 { margin: 16px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #a8a29e; font-weight: 600; }
  #panel .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #292524; cursor: pointer; }
  #panel .row:last-child { border-bottom: 0; }
  #panel .row .txt { flex: 1; min-width: 0; }
  #panel .row b { display: block; font-weight: 600; color: #fff; font-size: 16px; }
  #panel .row small { display: block; color: #a8a29e; font-size: 13px; line-height: 1.3; }
  #panel .sw { flex: none; width: 46px; height: 28px; border-radius: 14px; background: #44403c; position: relative; transition: background .15s; }
  #panel .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  #panel .row[aria-checked="true"] .sw { background: #15803d; }
  #panel .row[aria-checked="true"] .sw::after { transform: translateX(18px); }
  #panel .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 10px; }
  #panel .chip { border: 1px solid #57534e; background: #1c1917; color: var(--tan); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
  #panel .chip[aria-pressed="true"] { background: var(--tan); color: #111; border-color: var(--tan); }
  #panel .chips.off { display: none; }
  .key i.easy, .key i.mod, .key i.hard, .key i.unk { height: 0; background: none; border: 0; border-top: 4px dashed #22c55e; border-radius: 0; box-shadow: none; }
  .key i.mod { border-top-color: #3b82f6; } .key i.hard { border-top-color: #ef4444; } .key i.unk { border-top-color: #fff; }
  .key .k-trail { display: none; } body.trails-on .key .k-trail { display: inline-flex; }
  .pop .uses { color: #15803d; font-weight: 600; }
  .pop .lvl { font-weight: 700; }
  body.locked #map, body.locked .fab, body.locked .key, body.locked #panel { display: none; }
  #gate { display: none; max-width: 420px; margin: 32px auto; padding: 0 16px; text-align: center; }
  body.locked #gate { display: block; }
  #gate h2 { font-size: 20px; margin: 0 0 8px; }
  #gate p { color: var(--muted); margin: 0 0 16px; }
  #gate .err { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; font-size: 14px; }
  #gate a.go { display: block; background: #15803d; color: #fff; padding: 12px 16px; border-radius: 10px; text-decoration: none; font-weight: 600; }
  .leaflet-control-attribution { white-space: nowrap; overflow-x: auto; max-width: 100vw; font-size: 10px; background: rgba(17,17,17,.6) !important; color: #d6d3d1; }
  .leaflet-control-attribution a { color: var(--tan); }
  .leaflet-control-zoom { display: none; }
  @media (min-width: 700px) { .leaflet-control-zoom { display: block; } }
</style>
</head>
<body class="locked">
<header>
  <h1>Trails near you</h1>
  <a href="/">Back to Local America</a>
</header>
<div id="gate"><h2 id="gate-title">Checking your sign-in…</h2><p id="gate-text"></p><div id="gate-extra"></div></div>
<div id="note"></div>
<div id="map"></div>
<button class="fab" id="lay-btn" type="button" aria-label="Open layers" aria-expanded="false" aria-controls="panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="7" cy="18" r="2" fill="currentColor"/></svg><span>Layers</span></button>
<button class="fab" id="topo-btn" type="button" aria-label="Hide topo lines" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17c3-4 6-4 9-1s6 2 9-2"/><path d="M3 12c3-4 6-4 9-1s6 2 9-2"/><path d="M3 7c3-4 6-4 9-1s6 2 9-2"/></svg><span>Topo on</span></button>
<button class="fab" id="sat-btn" type="button" aria-label="Switch to the plain map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg><span>Map</span></button>
<button class="fab" id="me-btn" type="button" aria-label="Show where I am">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
</button>
<div class="key"><span><i class="hwy"></i>Highway</span><span><i></i>Open to drive</span><span><i class="dirt"></i>Dirt road, not checked</span><span><i class="land"></i>Public land</span><span><i class="pin"></i>Local America place</span><span class="k-trail"><i class="easy"></i>Easy trail</span><span class="k-trail"><i class="mod"></i>Moderate</span><span class="k-trail"><i class="hard"></i>Hard</span><span class="k-trail"><i class="unk"></i>Not rated</span></div>
<div id="panel" role="dialog" aria-label="Map layers" aria-hidden="true"><div class="grab"></div><div class="top"><h2>Layers</h2><button class="close" type="button">Done</button></div><div id="panel-body"></div></div>
<script>
// ---------- Owner only ----------
// Same sign-in as the Traffic page. The map starts only after Supabase confirms this is the owner account.
const sb = supabase.createClient('https://ycdlxdijrlfsxvxksyrq.supabase.co', 'sb_publishable_2ExdXbNtW9HpuOGAq1Oa7g_gPdONH_s', {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce', storageKey: 'la-traffic-auth' }
});
function gate(title, text, extra) {
  document.getElementById('gate-title').textContent = title;
  document.getElementById('gate-text').textContent = text || '';
  document.getElementById('gate-extra').innerHTML = extra || '';
}
const SIGN_IN = '<a class="go" href="/traffic.html">Go to the Traffic page to sign in</a>';
(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return gate('Sign in to see this page', 'This page is private. It uses the same sign-in as the Traffic page. Sign in there, then come back here.', SIGN_IN);
    const { data: ok, error } = await sb.rpc('is_traffic_admin');
    if (error) return gate('Could not check your sign-in', 'Pull down to reload the page.');
    if (ok !== true) {
      const email = session.user && session.user.email;
      await sb.auth.signOut();
      return gate('Sign in to see this page', `${email || 'That account'} is not allowed to see this page. Sign in with the Local America Gmail.`, SIGN_IN);
    }
    document.body.classList.remove('locked');
    startMap();
  } catch (e) {
    gate('Could not check your sign-in', 'Pull down to reload the page.');
  }
})();

function startMap() {
// Owner-only trails map (only the Local America owner account can open it; not linked from the app).
// - starts where you are (blue dot), or Willow Springs if location is off
// - satellite photo underneath (USGS, public domain); the Map button switches to the plain topo map
// - green = public land (Forest Service land from PAD-US)
// - cream lines with dark edges = Forest Service roads and trails open to vehicles today
// - thin tan lines = OpenStreetMap dirt and gravel roads (nobody has checked who may drive them)
// - pins = free Local America places (paid places have no public GPS)
const SUPABASE_URL = 'https://ycdlxdijrlfsxvxksyrq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2ExdXbNtW9HpuOGAq1Oa7g_gPdONH_s';
const WILLOW_SPRINGS = [36.9923, -91.9690];
const VEH_OK = ['any', 'jeep', 'wide', 'atv', 'moto'];
const MISSOURI = L.latLngBounds([35.99, -95.77], [40.62, -89.10]);

const map = L.map('map', { zoomControl: true, preferCanvas: true, tap: true, maxZoom: 19 }).setView(WILLOW_SPRINGS, 12);

// ---------- Layers panel ----------
// The Layers button opens a panel of switches. Choices are kept on this phone only (browser
// storage); if the phone won't keep them, the map just starts with the usual choices.
const PREF_KEY = 'la-trails-layers';
const prefs = (() => { try { const p = JSON.parse(localStorage.getItem(PREF_KEY)); return p && typeof p === 'object' && !Array.isArray(p) ? p : {}; } catch (e) { return {}; } })();
if (!VEH_OK.includes(prefs.veh)) prefs.veh = 'any';
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { /* not kept, that's fine */ } }
const panel = document.getElementById('panel'), panelBody = document.getElementById('panel-body'), layBtn = document.getElementById('lay-btn');
function setPanel(open) { panel.classList.toggle('open', open); panel.setAttribute('aria-hidden', String(!open)); layBtn.setAttribute('aria-expanded', String(open)); }
layBtn.addEventListener('click', () => setPanel(!panel.classList.contains('open')));
panel.querySelector('.close').addEventListener('click', () => setPanel(false));
map.on('click', () => setPanel(false));
const sections = {};
function section(id, title, sub) {
  if (!sections[id]) {
    const h = document.createElement('h3'); h.textContent = title;
    const box = document.createElement('div');
    panelBody.append(h, box);
    if (sub) { const p = document.createElement('div'); p.className = 'row'; p.style.cursor = 'default'; p.innerHTML = '<div class="txt"><small></small></div>'; p.querySelector('small').textContent = sub; box.append(p); }
    sections[id] = box;
  }
  return sections[id];
}
// One on/off switch. key is the saved name; on(true/false) shows or hides the layer.
function toggle(sec, key, title, sub, on, def = false) {
  const row = document.createElement('div');
  row.className = 'row'; row.setAttribute('role', 'switch'); row.tabIndex = 0;
  row.innerHTML = '<div class="txt"><b></b><small></small></div><span class="sw"></span>';
  row.querySelector('b').textContent = title;
  row.querySelector('small').textContent = sub || '';
  const set = (v, save) => { row.setAttribute('aria-checked', String(v)); prefs[key] = v; if (save) savePrefs(); on(v); };
  row.addEventListener('click', () => set(row.getAttribute('aria-checked') !== 'true', true));
  row.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); row.click(); } });
  sec.append(row);
  set(prefs[key] != null ? !!prefs[key] : def, false);
  return row;
}
// A row of buttons to pick from
function chips(sec, items, isOn, onTap) {
  const box = document.createElement('div'); box.className = 'chips';
  const paint = () => box.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', String(isOn(b.dataset.k))));
  items.forEach(([k, label]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = label; b.dataset.k = k;
    b.addEventListener('click', () => { onTap(k); paint(); });
    box.append(b);
  });
  paint(); sec.append(box);
  return box;
}
const renderer = L.canvas({ tolerance: 12 });

const topo = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}', {
  maxNativeZoom: 16, maxZoom: 19, className: 'base-topo', attribution: 'Base map: USGS The National Map'
});
const imagery = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/{z}/{y}/{x}', {
  maxNativeZoom: 16, maxZoom: 19, zIndex: 1, attribution: 'Base map: USGS The National Map'
}).addTo(map);

// Close up, the cached satellite above gets blurry (it stops at about 2.4 m per pixel).
// From zoom 14 the full-detail aerial photos (USDA NAIP, about 0.6 m per pixel) are drawn on top, straight from USGS.
// Topo lines: USGS elevation contours (brown lines with heights), drawn over the satellite from zoom 11.
const MERC = 20037508.342789244;
const ArcExport = L.TileLayer.extend({
  getTileUrl(c) {
    const size = (2 * MERC) / Math.pow(2, c.z);
    const bbox = [-MERC + c.x * size, MERC - (c.y + 1) * size, -MERC + (c.x + 1) * size, MERC - c.y * size].join(',');
    return this._base + '&bbox=' + bbox;
  }
});
const sharp = new ArcExport('', { minZoom: 14, maxNativeZoom: 18, maxZoom: 19, zIndex: 2, tileSize: 256 });
sharp._base = 'https://imagery.nationalmap.gov/arcgis/rest/services/USGSNAIPImagery/ImageServer/exportImage?f=image&format=jpg&bboxSR=3857&imageSR=3857&size=512,512&renderingRule=' + encodeURIComponent('{"rasterFunction":"NaturalColor"}');
sharp.addTo(map);
const contours = new ArcExport('', { minZoom: 11, maxZoom: 19, zIndex: 5, className: 'contours' });
contours._base = 'https://carto.nationalmap.gov/arcgis/rest/services/contours/MapServer/export?f=image&format=png32&transparent=true&bboxSR=3857&imageSR=3857&size=512,512&dpi=144';
// Zoomed out: only the bold every-5th lines with heights. Close up (16+): every line.
contours.getTileUrl = function (c) {
  const show = c.z >= 16 ? '2,10,11,15,16,21,22,25,26' : '2,10,11,15,16,21,25';
  return ArcExport.prototype.getTileUrl.call(this, c) + '&layers=show:' + show;
};
contours.addTo(map);
map.attributionControl.addAttribution('Aerial photos: USDA NAIP; Topo lines: USGS 3DEP');
map.attributionControl.setPrefix('');
map.attributionControl.addAttribution('Roads: Forest Service; Public land: USGS PAD-US; © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors');

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let noteTimer;
const note = (msg, ms) => {
  const n = document.getElementById('note'); clearTimeout(noteTimer);
  n.textContent = msg || ''; n.style.display = msg ? 'block' : 'none';
  if (msg && ms) noteTimer = setTimeout(() => note(''), ms);
};
const titleCase = (t) => String(t).toLowerCase().replace(/\b([a-z])/g, (m) => m.toUpperCase()).replace(/'S\b/g, "'s");
const miles = (m) => (m < 0.1 ? 'under 0.1' : m < 10 ? m.toFixed(1) : Math.round(m)) + ' mi';

// ---------- Where am I ----------
let me = null, meMarker = null, followed = false;
const meIcon = L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [20, 20], iconAnchor: [10, 10] });
function showMe(ll) {
  me = L.latLng(ll);
  if (!meMarker) meMarker = L.marker(me, { icon: meIcon, interactive: false, zIndexOffset: 1000 }).addTo(map);
  else meMarker.setLatLng(me);
}
function startLocation(centerOnIt) {
  if (!navigator.geolocation) { fallback("This phone isn't sharing its location, so here's Willow Springs."); return; }
  if (centerOnIt) note('Finding you…');
  navigator.geolocation.watchPosition((p) => {
    showMe([p.coords.latitude, p.coords.longitude]);
    if (!followed || centerOnIt) {
      followed = true; centerOnIt = false;
      if (MISSOURI.contains(me)) { map.setView(me, 14); note(''); }
      else fallback("You're outside Missouri, where this map has trails. Here's Willow Springs.");
    }
  }, () => { if (!followed) { followed = true; fallback('Location is off, so here is Willow Springs. Tap the blue button to try again.'); } },

// Closest place to a line, and how far

    for (let i = 0; i < pts.length; i += step) {
      const d = p.ll.distanceTo(pts[i]);

  }
  return heightCache.get(key);
}
let labelRun = 0;
async function drawLabels() {
  const run = ++labelRun, z = map.getZoom();
  if (z < 8) { labelLayer.clearLayers(); return; }
  const b = map.getBounds();
  const [lands, towns] = await Promise.all([
    z >= 12 ? gnis(5, "gaz_featureclass IN ('Summit','Valley','Ridge','Gap')", b) : [],
    z >= 11 ? gnis(1, '1=1', b).then((a) => (z >= 12 ? gnis(3, '1=1', b).then((c) => a.concat(c)) : a)) : []
  ]);
  if (run !== labelRun) return;
  const items = [];
  // highway shields: one per route, halfway along the part that is on screen (kept off the edges)
  const inner = b.pad(-0.1);
  mainLabels.forEach((m) => {
    const on = [];
    m.ll.forEach((path) => path.forEach((pt, i) => {
      if (i) { const half = [(pt[0] + path[i - 1][0]) / 2, (pt[1] + path[i - 1][1]) / 2]; if (inner.contains(half)) on.push(half); }
      if (inner.contains(pt)) on.push(pt);
    }));
    if (on.length) items.push({ kind: 'shield' + (m.cls ? ' ' + m.cls : ''), name: m.text, ll: L.latLng(on[Math.floor(on.length / 2)]), pri: 2.7 + m.rank / 10 + on.length / 1e6 });
  });
  const ptsOf = (f) => (f.geometry && (f.geometry.points || (f.geometry.x != null ? [[f.geometry.x, f.geometry.y]] : null))) || [];
  towns.forEach((f) => { if (!f.attributes.gaz_name || !ptsOf(f).length) return; const pt = ptsOf(f)[0]; items.push({ kind: 'town', name: f.attributes.gaz_name, ll: L.latLng(pt[1], pt[0]), pri: 3 }); });
  if (z >= 13) roadLabels.forEach((r) => { if (b.contains(r.ll) && r.text) items.push({ kind: 'road', name: r.text, ll: r.ll, pri: 2 }); });
  lands.forEach((f) => {
    const pts = ptsOf(f), c = f.attributes.gaz_featureclass;
    if (!f.attributes.gaz_name || !pts.length) return;
    const pt = pts.length > 1 ? [(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2] : pts[0];
    if (c !== 'Summit' && z < 13) return;
    items.push({ kind: c === 'Summit' ? 'peak' : 'valley', name: f.attributes.gaz_name, ll: L.latLng(pt[1], pt[0]), pri: c === 'Summit' ? 2.5 : 0 });
  });
  items.sort((x, y) => y.pri - x.pri);
  const taken = [], seen = new Set(), out = [];
  for (const it of items) {
    const k = it.kind + it.name; if (seen.has(k)) continue;
    const p = map.latLngToContainerPoint(it.ll);
    const w = it.name.length * (it.kind === 'town' ? 8.5 : 7.5) + 16, h = it.kind === 'peak' ? 44 : it.kind.startsWith('shield') ? 24 : 22;
    const box = [p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2];
    if (taken.some((t) => box[0] < t[2] && box[2] > t[0] && box[1] < t[3] && box[3] > t[1])) continue;
    taken.push(box); seen.add(k); out.push(it);
    if (out.length >= 45) break;
  }
  labelLayer.clearLayers();
  out.forEach((it) => {
    const id = 'h' + Math.random().toString(36).slice(2);
    const inner = it.kind === 'peak' ? `<b></b>${esc(it.name)}<small id="${id}"></small>` : esc(it.name);
    L.marker(it.ll, { interactive: false, keyboard: false, zIndexOffset: -100,
      icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="lbl ${it.kind}">${inner}</div>` }) }).addTo(labelLayer);
    if (it.kind === 'peak') peakHeight(it.ll).then((ft) => { const el = document.getElementById(id); if (el && ft) el.textContent = ft.toLocaleString('en-US') + ' ft'; });
  });
}
let labelTimer;
map.on('moveend', () => { clearTimeout(labelTimer); labelTimer = setTimeout(() => drawMain().finally(drawLabels), 250); });
setTimeout(() => drawMain().finally(drawLabels), 400);
map.attributionControl.addAttribution('Names and heights: USGS GNIS, 3DEP; Highways: USGS; Trails: USDA Forest Service, © OpenStreetMap contributors');

// ---------- Hiking, bike and horse trails (off until switched on in Layers) ----------
// Forest Service trails (Mark Twain National Forest) and OpenStreetMap paths. They load one small
// square at a time through our own site (api/trails-data), only while the switch is on.
const trailLayer = L.layerGroup();
const TRAIL_MIN_ZOOM = 11, PATH_MIN_ZOOM = 12, CELL = 0.25;
const TRAIL_SQ = { x0: -384, x1: -356, y0: 143, y1: 163 }; // same squares the map data service takes
const TRAIL_COLORS = { easy: '#22c55e', mod: '#3b82f6', hard: '#ef4444', unk: '#ffffff' };
const TRAIL_LEVEL = { easy: 'Easy', mod: 'Moderate', hard: 'Hard', unk: 'Not rated' };
if (!prefs.uses || typeof prefs.uses !== 'object') prefs.uses = { foot: true, bike: true, horse: true };
const trailAsked = new Set(), fsTrailNames = new Map(), fsCellLoads = new Map(), trailItems = [];
// Forest Service trail names by square, so a copy of the same trail from OpenStreetMap is only skipped close by
function fsNamesNear(i, j, key) {
  for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) { const s = fsTrailNames.get((i + di) + '_' + (j + dj)); if (s && s.has(key)) return true; }
  return false;
}
let trailsOn = false, trailZoomNote = false, trailFailNote = false;
const said = (v) => v != null && String(v).trim() !== '';
const nameKey = (n) => String(n || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\b(trail|tr|spur|loop|section|segment|the|nrt|ot)\b/g, ' ').replace(/\s+/g, ' ').trim();
function usesText(u) {
  const t = [u.foot && 'Hiking', u.horse && 'horses', u.bike && 'bikes'].filter(Boolean);
  return t.length ? t.join(', ').replace(/^./, (c) => c.toUpperCase()) : '';
}
// Forest Service trail class 1 is the roughest, 5 the most built up
function fsTrailLevel(a) {
  const c = String(a.trail_class || '').trim();
  return c === '1' || c === '2' ? 'hard' : c === '3' ? 'mod' : c === '4' || c === '5' ? 'easy' : 'unk';
}
const CLASS_TEXT = { 1: 'barely built, rough and hard to follow', 2: 'narrow and rough', 3: 'a clear, worn path', 4: 'wide and smooth', 5: 'fully built, often paved' };
const YES = /^(yes|designated|permissive|official)$/;
function osmUses(a) {
  const h = a.highway;
  return {
    foot: a.foot ? YES.test(a.foot) : h === 'path' || h === 'footway',
    bike: a.bicycle ? YES.test(a.bicycle) : h === 'cycleway' || said(a['mtb:scale']),
    horse: a.horse ? YES.test(a.horse) : h === 'bridleway',
  };
}
// OpenStreetMap hiking and bike scales, plus "hard to see" trails
function osmLevel(a) {
  const rank = { easy: 1, mod: 2, hard: 3 };
  let lvl = 'unk';
  const up = (l) => { if (lvl === 'unk' || rank[l] > rank[lvl]) lvl = l; };
  const sac = a.sac_scale;
  if (sac === 'hiking') up('easy'); else if (sac === 'mountain_hiking') up('mod'); else if (sac) up('hard');
  const mtb = parseInt(a['mtb:scale'], 10);
  if (Number.isFinite(mtb)) up(mtb <= 0 ? 'easy' : mtb <= 2 ? 'mod' : 'hard');
  if (/^(bad|horrible|no)$/.test(a.trail_visibility || '')) up('hard');
  return lvl;
}
const OSM_KIND = { path: 'Trail', footway: 'Footpath', bridleway: 'Horse trail', cycleway: 'Bike path' };
function trailPopup(t, latlngs) {
  const lvl = `<span class="lvl" style="color:${t.lvl === 'unk' ? '#57534e' : TRAIL_COLORS[t.lvl]}">${TRAIL_LEVEL[t.lvl]}</span>`;
  const len = t.mi != null ? t.mi : lineMiles(latlngs);
  return `<div class="pop"><h3>${esc(t.name)}</h3><div class="big">${lvl} · ${miles(len).replace(' mi', ' miles')}</div>` +
    `${t.uses ? `<div class="uses">${esc(t.uses)}</div>` : ''}${t.extra ? `<div>${esc(t.extra)}</div>` : ''}${placeAndYou(latlngs)}<div class="small">${esc(t.src)}</div></div>`;
}
function addTrail(ll, uses, t) {
  const round = { lineCap: 'round', lineJoin: 'round' };
  const edge = L.polyline(ll, { renderer, color: '#111', weight: 6.5, opacity: 0.75, interactive: false, ...round });
  const line = L.polyline(ll, { renderer, color: TRAIL_COLORS[t.lvl], weight: 3.5, opacity: 1, dashArray: '8 6', ...round }).bindPopup(() => trailPopup(t, ll));
  const item = { uses, edge, line };
  trailItems.push(item);
  showTrail(item);
}
function showTrail(item) {
  const on = ['foot', 'bike', 'horse'].some((u) => prefs.uses[u] && item.uses[u]);
  [item.edge, item.line].forEach((l) => (on ? l.addTo(trailLayer) : l.remove()));
}
function drawFsTrails(j, cell) {
  (j.features || []).forEach((f) => {
    const a = f.a || {};
    const uses = { foot: said(a.hiker_pedestrian_managed) || said(a.hiker_pedestrian_accpt), horse: said(a.pack_saddle_managed) || said(a.pack_saddle_accpt), bike: said(a.bicycle_managed) || said(a.bicycle_accpt) };
    if (!uses.foot && !uses.horse && !uses.bike) return; // motor-only trails are already on the map in gold
    const id = 'fs' + (a.trail_no || '') + '|' + (f.p[0] && f.p[0][0] && f.p[0][0].join(','));
    if (trailAsked.has(id)) return; trailAsked.add(id);
    const nk = a.trail_name ? nameKey(a.trail_name) : '';
    if (nk && cell) { if (!fsTrailNames.has(cell)) fsTrailNames.set(cell, new Set()); fsTrailNames.get(cell).add(nk); }
    const width = String(a.typical_tread_width || '').match(/(\d+\s*-\s*\d+|\d+\+?)\s*(INCHES|IN|FEET|FT)/i);
    const extra = [a.trail_surface && a.trail_surface !== 'NATIVE MATERIAL' ? titleCase(a.trail_surface) : 'Dirt', width ? width[1].replace(/\s/g, '') + ' ' + (/^F/i.test(width[2]) ? 'feet' : 'inches') + ' wide' : ''].filter(Boolean).join(', ');
    const cls = String(a.trail_class || '').trim();
    addTrail(f.p.map((path) => path.map(([x, y]) => L.latLng(y, x))), uses, {
      name: a.trail_name ? titleCase(a.trail_name) : a.trail_no ? 'Trail ' + a.trail_no : 'Forest Service trail',
      lvl: fsTrailLevel(a), mi: a.gis_miles != null ? Number(a.gis_miles) : null, uses: usesText(uses), extra,
      src: `From the Forest Service${CLASS_TEXT[cls] ? ` (trail class ${cls} of 5: ${CLASS_TEXT[cls]})` : ''}. Allowed doesn't mean it's in good shape today.`,
    });
  });
}
// OpenStreetMap paths for all of Missouri live in one file on our own site (trails-data/paths-mo.bin),
// cut into 0.25 degree squares like the dirt road file, so the phone reads only the squares on screen.
// Each row: [kind, miles, name, coordinates, id, surface]
const PATHS_FILE = '/trails-data/paths-mo.bin';
let pathsIdxP = null, pathsWhole = null;
async function pathRange(from, to) {
  if (pathsWhole) return pathsWhole.slice(from, to + 1);
  const r = await fetch(PATHS_FILE, { headers: { Range: `bytes=${from}-${to}` } });
  if (!r.ok) throw new Error(r.status);
  const b = new Uint8Array(await r.arrayBuffer());
  if (r.status === 206) return b;
  pathsWhole = b; // the site sent the whole file; keep it and cut pieces from it
  return b.slice(from, to + 1);
}
function pathsIndex() {
  return pathsIdxP || (pathsIdxP = (async () => {
    let head = await pathRange(0, 65535);
    const len = +new TextDecoder().decode(head.slice(0, 10));
    if (!len) throw new Error('bad file');
    if (10 + len > head.length) head = await pathRange(0, 9 + len);
    return { idx: JSON.parse(new TextDecoder().decode(head.slice(10, 10 + len))), start: 10 + len };
  })().catch((e) => { pathsIdxP = null; throw e; }));
}
async function pathCell(i, j) {
  const { idx, start } = await pathsIndex();
  const t = idx.tiles[i + '_' + j];
  if (!t) return [];
  return gunzipJson(await pathRange(start + t[0], start + t[0] + t[1] - 1));
}
function drawPaths(rows, i, j) {
  for (const [kind, mi, name, coords, id, surface] of rows) {
    if (trailAsked.has('osm' + id)) continue; trailAsked.add('osm' + id);
    const nk = name ? nameKey(name) : '';
    if (nk && fsNamesNear(i, j, nk)) continue; // already shown from the Forest Service
    const a = { highway: kind };
    const uses = osmUses(a);
    if (!uses.foot && !uses.horse && !uses.bike) continue;
    const ll = typeof coords[0][0] === 'number' ? [coords.map(([x, y]) => L.latLng(y, x))] : coords.map((c) => c.map(([x, y]) => L.latLng(y, x)));
    addTrail(ll, uses, {
      name: name || OSM_KIND[kind] || 'Trail', lvl: osmLevel(a), mi, uses: usesText(uses),
      extra: surface ? titleCase(String(surface).replace(/_/g, ' ')) : '',
      src: 'Map data © OpenStreetMap contributors. Nobody has checked this one, and some cross private land.',
    });
  }
}
function getCell(src, i, j) {
  return fetch(`/api/trails-data?src=${src}&x=${i}&y=${j}`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
}
function loadTrails() {
  if (!trailsOn) return;
  const z = map.getZoom();
  if (z < TRAIL_MIN_ZOOM) { if (!trailZoomNote) { trailZoomNote = true; note('Zoom in to see the trails', 3000); } return; }
  const b = map.getBounds().pad(0.15);
  // only the squares the map data covers (Missouri plus a little edge)
  const i0 = Math.max(TRAIL_SQ.x0, Math.floor(b.getWest() / CELL)), i1 = Math.min(TRAIL_SQ.x1, Math.floor(b.getEast() / CELL));
  const j0 = Math.max(TRAIL_SQ.y0, Math.floor(b.getSouth() / CELL)), j1 = Math.min(TRAIL_SQ.y1, Math.floor(b.getNorth() / CELL));
  for (let i = i0; i <= i1; i++) {
    for (let j = j0; j <= j1; j++) {
      const cell = i + '_' + j, osmKey = `cell-osm-${cell}`;
      if (!fsCellLoads.has(cell)) {
        fsCellLoads.set(cell, getCell('fstrails', i, j).then((d) => drawFsTrails(d, cell)).catch(() => { fsCellLoads.delete(cell); failNote(); }));
      }
      if (z >= PATH_MIN_ZOOM && !trailAsked.has(osmKey)) {
        trailAsked.add(osmKey);
        // wait for the Forest Service trails here and next door, so the same trail isn't drawn twice
        const near = [];
        for (let di = -1; di <= 1; di++) for (let dj = -1; dj <= 1; dj++) { const p = fsCellLoads.get((i + di) + '_' + (j + dj)); if (p) near.push(p); }
        Promise.all(near).then(() => pathCell(i, j)).then((rows) => drawPaths(rows, i, j)).catch(() => { trailAsked.delete(osmKey); failNote(); });
      }
    }
  }
}
function failNote() { if (!trailFailNote) { trailFailNote = true; note("Couldn't load some trails. Move the map to try again.", 5000); setTimeout(() => { trailFailNote = false; }, 20000); } }
map.on('moveend', loadTrails);

const trailSec = section('trails', 'Trails');
let useChips;
toggle(trailSec, 'trails', 'Hiking, bike and horse trails', 'Colored by how hard they are. Forest Service and OpenStreetMap.', (v) => {
  trailsOn = v;
  document.body.classList.toggle('trails-on', v);
  if (useChips) useChips.classList.toggle('off', !v);
  if (v) { trailLayer.addTo(map); loadTrails(); } else trailLayer.remove();
});
useChips = chips(trailSec, [['foot', 'Hiking'], ['bike', 'Bikes'], ['horse', 'Horses']], (k) => !!prefs.uses[k], (k) => {
  prefs.uses[k] = !prefs.uses[k]; savePrefs();
  trailItems.forEach(showTrail);
});
useChips.classList.toggle('off', !trailsOn);

const vehSec = section('veh', 'Forest roads open to', 'Hides Forest Service roads and trails your vehicle may not use. Dirt roads from OpenStreetMap stay on, unchecked.');
chips(vehSec, VEH_OK.map((k) => [k, VEHICLES[k].name]), (k) => prefs.veh === k, (k) => {
  prefs.veh = k; savePrefs();
  drawFs();
  if (k !== 'any') note('Showing Forest Service roads open to ' + VEHICLES[k].short, 4000);
});

// ---------- Start ----------
// For checking the page: ?at=lat,lng skips location; ?open=fs or ?open=dirt opens one line's info box
const qs = new URLSearchParams(location.search);
const at = qs.get('at');
const atLL = at ? at.split(',').map(Number) : [];
if (atLL.length === 2 && atLL.every(Number.isFinite)) { showMe(atLL); followed = true; map.setView(me, 14); }
else startLocation(false);
const openParam = qs.get('open');
let tries = 0;
function demoOpen() {
  let first;
  const take = (l) => { if (!first && l.getPopup && l.getPopup()) first = l; };
  if (openParam === 'fs') fsLayer.eachLayer(take); else if (openParam === 'land') landLayer.eachLayer((l) => { if (!first && /Conservation area: Peck/.test(l.getPopup()._content() || '')) first = l; }); else map.eachLayer((l) => { if (l.feature) take(l); });
  if (!first) { if (++tries < 30) setTimeout(demoOpen, 1000); return; }
  const ll = first.getLatLngs().flat(3); first.openPopup(ll[Math.floor(ll.length / 2)]);
}
if (openParam) setTimeout(demoOpen, 1500);
}
</script>
